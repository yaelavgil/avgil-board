<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>רשימת תיקונים — אשל 57</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{
  --paper:#FBFAF5; --card:#fff; --ink:#2C2A26; --muted:#7D7A70;
  --line:#E6E3D7; --line2:#D5D1C0;
  --olive:#6C7A44; --olive-ink:#4E5A2E; --olive-soft:#EFF1E2;
  --red:#C0452F; --red-soft:#FBEDEA;
  --amber:#B4832B; --amber-soft:#FBF2DF;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1A1917; --card:#232220; --ink:#ECE9E0; --muted:#9B968A;
  --line:#333230; --line2:#444240;
  --olive:#9DAE6E; --olive-ink:#B6C586; --olive-soft:#2A2E22;
  --red:#E07A63; --red-soft:#33211D; --amber:#D7A64A; --amber-soft:#2F2819;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.55 Assistant,-apple-system,"system-ui","Segoe UI",Arial,sans-serif;
  padding:0 15px calc(44px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto}
header{padding:22px 0 10px}
h1{font-family:Karantina,Assistant,sans-serif;font-weight:700;font-size:38px;line-height:1;margin:0 0 6px}
.lede{color:var(--muted);font-size:14.5px;margin:0}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:13px;font-weight:600;margin:0 0 0 6px}
.pill.ok{background:var(--olive-soft);border-color:var(--olive);color:var(--olive-ink)}
.pill.hot{background:var(--red-soft);border-color:var(--red);color:var(--red)}

/* ===== מסך הצירוף — זה המסך שרועי מקבל, והוא כל המסך ===== */
.drop{display:block;border:2.5px dashed var(--olive);border-radius:20px;background:var(--olive-soft);
  color:var(--olive-ink);text-align:center;padding:40px 18px;cursor:pointer;margin:18px 0 10px;
  font-weight:800;font-size:19px;transition:transform .12s}
.drop:active{transform:scale(.99)}
.drop small{display:block;font-weight:600;font-size:13.5px;color:var(--muted);margin-top:8px}
.drop input{display:none}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--olive);width:0;transition:width .25s}
.qline{font-size:13.5px;color:var(--muted);margin:6px 0 0;min-height:19px}

/* ===== כרטיס תקלה ===== */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;margin:0 0 13px;display:flex;gap:13px;align-items:flex-start}
.item.fixed{opacity:.55}
.item .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-weight:800;font-size:13px}
.item .ph{flex:0 0 auto;width:132px}
.item .ph img{width:132px;height:132px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
  cursor:zoom-in;display:block;background:var(--line)}
.item .ph .nofile{width:132px;height:132px;border-radius:10px;border:1px dashed var(--line2);
  display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.item .body{flex:1;min-width:0}
.fld{margin:0 0 7px}
.fld label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:9px;padding:7px 9px;font:inherit;font-size:14px}
.fld textarea{min-height:46px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--olive)}
.fld .empty{border-color:var(--amber);background:var(--amber-soft)}
.rowb{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.rowb button{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:9px;
  padding:6px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.rowb button:hover{border-color:var(--olive);color:var(--olive-ink)}
.rowb button.del:hover{border-color:var(--red);color:var(--red)}

/* ===== תצוגת מסמך לבעל מקצוע ===== */
.doc .item{display:block}
.doc .item .top{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.doc .item .ph,.doc .item .ph img{width:100%;height:auto;max-height:none}
.doc .item .ph img{height:auto;max-height:420px;object-fit:contain;background:var(--paper)}
.doc .ro{font-size:15px;margin:3px 0}
.doc .ro b{color:var(--muted);font-weight:800;font-size:12.5px;display:block}

.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tabs a{border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;
  border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700}
.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sups{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.sups a{border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.sups a.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.big{display:block;width:100%;border:none;border-radius:13px;background:var(--olive);color:#fff;
  padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin:14px 0 0}
.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.empty-state{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom));margin-inline:auto;
  width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:10px 18px;
  border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:80;padding:14px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:92vh;border-radius:10px}
@media print{
  body{background:#fff;padding:0}
  .tabs,.sups,.drop,.big,.rowb,.noprint{display:none!important}
  .item{break-inside:avoid;border-color:#bbb}
}
@media (max-width:560px){
  .item{flex-wrap:wrap}
  .item .ph,.item .ph img,.item .ph .nofile{width:100%;height:auto}
  .item .ph img{height:auto;max-height:280px;object-fit:contain;background:var(--paper)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">רשימת תיקונים</h1>
    <p class="lede" id="lede">אשל 57, בת חפר</p>
  </header>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<script>
/* ===== אחסון =====
   אותו Firebase ואותו צומת קבצים שהלוח ודף התשלומים משתמשים בהם, כדי שמה
   שרועי מצרף מהנייד יופיע אצל יעל בלי שלב ביניים. Storage לא מופעל בפרויקט,
   ולכן התמונה נשמרת כ-dataURL מוקטן תחת files/<fid>. */
const DB='https://home-picks-47450-default-rtdb.europe-west1.firebasedatabase.app';
const BED=DB+'/board/bedek', FDATA=DB+'/board/files';
const MAXB=700*1024;

const SUPS=[
  {id:'parq',    name:'יעקב — פרקט',        what:'פרקט, ספים, פאנלים ותיקונים'},
  {id:'barak',   name:'ברק — קבלן',          what:'שפכטל, צבע, רובה, משקופים ואיטומים'},
  {id:'carlos',  name:'קרלוס — חשמל',        what:'שקעים, מתגים ונקודות תאורה'},
  {id:'mahmoud', name:'מחמוד — אלומיניום',   what:'חלונות, דלתות, רשתות וסיליקון'},
  {id:'plumb',   name:'אינסטלטור',           what:'צנרת, ניקוזים וברזים'},
  {id:'tile',    name:'ריצוף',               what:'קרמיקה, רובה וסיומות'},
  {id:'kitchen', name:'פורמג׳ו — מטבח',      what:'חזיתות, צוקל ודפנות'},
  {id:'rafael',  name:'רפאל — נגרות רחצה',   what:'ארונות אמבט, מדפים וידיות'},
  {id:'liran',   name:'לירן — מקלחונים',     what:'זכוכית, פרופילים ואטימה'},
  {id:'other',   name:'אחר',                 what:'כל מה שלא נכנס לקטגוריה'}
];
const supBy=id=>SUPS.find(s=>s.id===id);

const qs=new URLSearchParams(location.search);
const SUP=qs.get('s')||'';
const ADD=qs.get('add')==='1';
const PRO=qs.get('pro')==='1';

let DATA={};
const $=s=>document.querySelector(s);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}

/* רשת נופלת מדי פעם, ולכן כל כתיבה מנסה שוב ולא נעלמת בשקט */
async function put(url,body,method){
  for(let a=0;a<4;a++){
    try{
      const r=await fetch(url,{method:method||'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
      if(r.ok)return true;
    }catch(e){}
    await new Promise(r=>setTimeout(r,900*(a+1)));
  }
  return false;
}
async function getJSON(url){
  try{const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;}
  catch(e){return null;}
}
/* תמונה מהנייד היא 4–12 מגה. בלי הקטנה זה לא נכנס ל-Realtime DB. */
function shrink(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type)||/svg/.test(file.type))return res(null);
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const max=1600,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72));};
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';

async function load(){
  DATA=(await getJSON(BED+'.json'))||{};
}
const listOf=id=>Object.entries((DATA[id]||{}))
  .map(([k,v])=>({k,...v}))
  .sort((a,z)=>(a.ord||0)-(z.ord||0)||(a.at||0)-(z.at||0));

/* ===== צירוף קבצים — batch ===== */
async function addFiles(supId,files,onProg){
  const arr=[...files];
  let ok=0,fail=0;
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    onProg(i,arr.length,f.name);
    let data=await shrink(f);
    if(!data){
      if(f.size>MAXB){fail++;continue;}
      try{data=await readURL(f);}catch(e){fail++;continue;}
    }
    if(data.length>MAXB*1.4){fail++;continue;}
    const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    if(!await put(FDATA+'/'+fid+'.json',data)){fail++;continue;}
    const id='d'+Date.now().toString(36)+i;
    const rec={fid,name:f.name||'',type:f.type||'',loc:'',what:'',fix:'',done:false,
               at:Date.now(),ord:Date.now()+i};
    if(!await put(BED+'/'+supId+'/'+id+'.json',rec)){fail++;continue;}
    DATA[supId]=DATA[supId]||{}; DATA[supId][id]=rec;
    ok++;
  }
  return {ok,fail};
}

/* ===== מסכים ===== */
function render(){
  const app=$('#app'); app.innerHTML='';
  if(!SUP){ return renderPicker(app); }
  const s=supBy(SUP)||{id:SUP,name:SUP,what:''};
  const items=listOf(SUP);
  const open=items.filter(i=>!i.done).length;

  $('#h1').textContent = ADD?'צירוף תמונות' : 'רשימת תיקונים';
  $('#lede').innerHTML = `<b>${esc(s.name)}</b> · ${esc(s.what||'')} · אשל 57`;

  if(ADD) return renderAdd(app,s,items);
  if(PRO) return renderDoc(app,s,items,true);

  app.appendChild(el(`<div class="tabs noprint">
    <a href="?s=${s.id}" class="on">עריכה</a>
    <a href="?s=${s.id}&add=1">צירוף תמונות</a>
    <a href="?s=${s.id}&pro=1">תצוגה לבעל מקצוע</a>
    <a href="?">כל בעלי המקצוע</a>
  </div>`));
  app.appendChild(el(`<p class="lede">
    <span class="pill ${open?'hot':'ok'}">${open} פתוחות</span>
    <span class="pill">${items.length} סה״כ</span></p>`));

  const drop=mkDrop(s,()=>{load().then(render);});
  app.appendChild(drop);

  if(!items.length){
    app.appendChild(el('<div class="empty-state">עוד אין תקלות ברשימה.<br>אפשר לצרף תמונות מכאן, או לשלוח לרועי את הלינק לצירוף.</div>'));
  }
  items.forEach((it,i)=>app.appendChild(cardEdit(s,it,i+1)));

  const sh=el('<button class="big ghost noprint">📤 העתקת לינק לצירוף — לשלוח לרועי</button>');
  sh.onclick=async()=>{
    const u=location.origin+location.pathname+'?s='+s.id+'&add=1';
    try{await navigator.clipboard.writeText(u);toast('הלינק הועתק ✓');}catch(e){prompt('הלינק:',u);}
  };
  app.appendChild(sh);
  const sh2=el('<button class="big ghost noprint">🔗 העתקת לינק לבעל המקצוע</button>');
  sh2.onclick=async()=>{
    const u=location.origin+location.pathname+'?s='+s.id+'&pro=1';
    try{await navigator.clipboard.writeText(u);toast('הלינק הועתק ✓');}catch(e){prompt('הלינק:',u);}
  };
  app.appendChild(sh2);
}

function renderPicker(app){
  $('#h1').textContent='רשימת תיקונים';
  $('#lede').textContent='בחרי בעל מקצוע. לכל אחד רשימה משלו, עם לינק לצירוף תמונות ולינק לשליחה אליו.';
  const g=el('<div class="sups"></div>');
  SUPS.forEach(s=>{
    const n=listOf(s.id).filter(i=>!i.done).length;
    const a=el(`<a href="?s=${s.id}">${esc(s.name)}${n?` · ${n}`:''}</a>`);
    g.appendChild(a);
  });
  app.appendChild(g);
}

/* מסך הצירוף — זה מה שרועי רואה. כפתור אחד, ותו לא. */
function renderAdd(app,s,items){
  app.appendChild(el(`<p class="lede">צרף כמה תמונות שתרצה בבת אחת. אפשר גם לצלם עכשיו.<br>
    <b>לא צריך לכתוב כלום</b> — יעל תשלים את הפירוט.</p>`));
  app.appendChild(mkDrop(s,()=>{load().then(()=>{render();});},true));
  if(items.length){
    app.appendChild(el(`<p class="lede" style="margin-top:16px">צורפו עד כה <b>${items.length}</b> תמונות.</p>`));
    const g=el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>');
    items.slice().reverse().forEach(it=>{
      const im=el('<img style="width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:var(--line)" alt="">');
      g.appendChild(im); fillImg(im,it.fid);
    });
    app.appendChild(g);
  }
  const back=el(`<a class="big ghost noprint" style="text-align:center;text-decoration:none;display:block" href="?s=${s.id}">סיימתי — למסמך המלא</a>`);
  app.appendChild(back);
}

function mkDrop(s,after,big){
  const d=el(`<label class="drop">${big?'📷 צירוף תמונות':'📷 צירוף תמונות או קבצים'}
    <small>אפשר לבחור כמה ביחד · תמונות, צילומי מסך ו-PDF</small>
    <input type="file" multiple accept="image/*,application/pdf,.pdf,.heic,.heif"></label>`);
  const bar=el('<div class="bar"><i></i></div>'); bar.style.display='none';
  const q=el('<p class="qline"></p>');
  const inp=d.querySelector('input');
  const wrap=el('<div></div>'); wrap.appendChild(d); wrap.appendChild(bar); wrap.appendChild(q);
  inp.onchange=async()=>{
    const fs=inp.files; if(!fs||!fs.length)return;
    bar.style.display='block';
    const res=await addFiles(s.id,fs,(i,n,nm)=>{
      bar.querySelector('i').style.width=Math.round(i/n*100)+'%';
      q.textContent=`מעלה ${i+1} מתוך ${n} — ${nm}`;
    });
    bar.querySelector('i').style.width='100%';
    q.textContent='';
    bar.style.display='none';
    inp.value='';
    toast(res.fail?`נוספו ${res.ok} · ${res.fail} נכשלו`:`נוספו ${res.ok} תמונות ✓`);
    if(after)after();
  };
  /* גרירה מהמחשב, בנוסף לבחירה מהנייד */
  ['dragover','dragenter'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.style.transform='scale(1.01)';}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.style.transform='';}));
  d.addEventListener('drop',async ev=>{
    const fs=ev.dataTransfer&&ev.dataTransfer.files; if(!fs||!fs.length)return;
    bar.style.display='block';
    const res=await addFiles(s.id,fs,(i,n,nm)=>{
      bar.querySelector('i').style.width=Math.round(i/n*100)+'%';
      q.textContent=`מעלה ${i+1} מתוך ${n} — ${nm}`;});
    bar.style.display='none'; q.textContent='';
    toast(`נוספו ${res.ok} תמונות ✓`); if(after)after();
  });
  return wrap;
}

async function fillImg(imgEl,fid){
  const d=await getJSON(FDATA+'/'+fid+'.json');
  if(typeof d==='string'){ imgEl.src=d; imgEl.onclick=()=>{$('#lbimg').src=d;$('#lb').classList.add('on');}; }
}

function cardEdit(s,it,n){
  const c=el(`<div class="item ${it.done?'fixed':''}">
    <span class="n">${n}</span>
    <div class="ph"></div>
    <div class="body"></div></div>`);
  const ph=c.querySelector('.ph'), body=c.querySelector('.body');
  if(it.fid){ const im=el('<img alt="">'); ph.appendChild(im); fillImg(im,it.fid); }
  else ph.appendChild(el('<div class="nofile">בלי תמונה</div>'));

  const mk=(key,label,ph2,area)=>{
    const f=el(`<div class="fld"><label>${label}</label>${
      area?`<textarea placeholder="${ph2}"></textarea>`:`<input placeholder="${ph2}">`}</div>`);
    const inp=f.querySelector('input,textarea');
    inp.value=it[key]||'';
    if(!inp.value)inp.classList.add('empty');
    let t;
    const save=async()=>{
      const v=inp.value.trim();
      if(v===(it[key]||''))return;
      it[key]=v; inp.classList.toggle('empty',!v);
      await put(BED+'/'+s.id+'/'+it.k+'/'+key+'.json',v);
    };
    inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(save,700);});
    inp.addEventListener('blur',save);
    return f;
  };
  body.appendChild(mk('loc','מיקום בבית','למשל: כניסה לחדר רחצה ילדים'));
  body.appendChild(mk('what','מה התקלה','מה רואים בתמונה',true));
  body.appendChild(mk('fix','מה צריך לעשות','מה אמור להיות שם במקום',true));

  const b=el('<div class="rowb noprint"></div>');
  const dn=el(`<button>${it.done?'↩ החזרה לפתוחות':'✓ תוקן'}</button>`);
  dn.onclick=async()=>{ it.done=!it.done; await put(BED+'/'+s.id+'/'+it.k+'/done.json',it.done);
    c.classList.toggle('fixed',it.done); dn.textContent=it.done?'↩ החזרה לפתוחות':'✓ תוקן'; };
  b.appendChild(dn);
  const del=el('<button class="del">מחיקה</button>');
  del.onclick=async()=>{
    if(!confirm('למחוק את התקלה הזו מהרשימה?'))return;
    await put(BED+'/'+s.id+'/'+it.k+'.json',null,'DELETE');
    if(it.fid)await put(FDATA+'/'+it.fid+'.json',null,'DELETE');
    delete DATA[s.id][it.k]; c.remove(); toast('נמחק');
  };
  b.appendChild(del);
  body.appendChild(b);
  return c;
}

/* תצוגת המסמך — זה מה שבעל המקצוע מקבל */
function renderDoc(app,s,items,pro){
  const open=items.filter(i=>!i.done);
  $('#h1').textContent='רשימת תיקונים והשלמות';
  $('#lede').innerHTML=`<b>${esc(s.name)}</b> · אשל 57, בת חפר · ${new Date().toLocaleDateString('he-IL')}`;
  app.classList.add('doc');
  app.appendChild(el(`<p class="lede"><span class="pill hot">${open.length} פריטים לטיפול</span></p>`));
  if(!open.length){
    app.appendChild(el('<div class="empty-state">אין כרגע פריטים פתוחים ברשימה.</div>'));
  }
  open.forEach((it,i)=>{
    const c=el(`<div class="item">
      <div class="top"><span class="n">${i+1}</span>
        <b>${esc(it.loc||'מיקום — להשלמה')}</b></div>
      <div class="ph"></div>
      <div class="body"></div></div>`);
    const ph=c.querySelector('.ph'),body=c.querySelector('.body');
    if(it.fid){const im=el('<img alt="">');ph.appendChild(im);fillImg(im,it.fid);}
    body.appendChild(el(`<div class="ro"><b>מה התקלה</b>${esc(it.what)||'<span style="color:var(--muted)">—</span>'}</div>`));
    body.appendChild(el(`<div class="ro"><b>מה צריך לעשות</b>${esc(it.fix)||'<span style="color:var(--muted)">—</span>'}</div>`));
    app.appendChild(c);
  });
  const p=el('<button class="big ghost noprint">🖨 הדפסה או שמירה כ-PDF</button>');
  p.onclick=()=>window.print();
  app.appendChild(p);
}

$('#lb').onclick=()=>$('#lb').classList.remove('on');

load().then(render);
</script>
