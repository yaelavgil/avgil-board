        b+=`<p dir="rtl" style="font-size:11.5pt;margin:0 0 3pt"><b>${num}.</b> ${esc(noteOf(it))}`+
           (it.loc2?` <span style="color:#888;font-size:9.5pt">· ${esc(it.loc2)}</span>`:'')+`</p>`;
      });
    });
  });
  b+=`<p dir="rtl" style="margin-top:20pt;font-size:9.5pt;color:#777;border-top:1px solid #ccc;padding-top:8pt">
    נחתם בתאריך ___________ &nbsp; שם ___________________ &nbsp; חתימה ___________________<br>
    מועד משוער לסיום ההשלמות: ___________________</p>`;
  return `<html lang="he" dir="rtl"><head><meta charset="utf-8"></head>`+
         `<body dir="rtl" style="font-family:Arial,sans-serif;direction:rtl;text-align:right">${b}</body></html>`;
}
async function copyRich(){
  /* את שני הפורמטים בונים לפני ה-await — ספארי מבטל כתיבה ללוח
     שלא יצאה מתוך אותו אירוע לחיצה */
  const html=docHtml(), text=waText();
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html':new Blob([html],{type:'text/html'}),
      'text/plain':new Blob([text],{type:'text/plain'})
    })]);
    toast('הועתק — להדביק בגוגל דוקס. התמונות לא עוברות בהדבקה.',3200);
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('הועתק כטקסט'); }
    catch(e2){ toast('ההעתקה נכשלה'); }
  }
}

/* שמירה שנכשלה בשטח — רשת שנפלה באמצע — משאירה פריט עם מיקום והסבר
   אבל בלי k, כלומר תמונה שהמשתמש כבר טיפל בה ושלא הגיעה ללוח. ניסיון
   חוזר בטעינה סוגר את זה בלי שיצטרך לגעת בכל כרטיס שוב. */
async function retryPending(){
  /* רק מה שרועי כבר אישר. לפני התנאי הזה, תמונה שקיבלה הצעה אוטומטית
     והוא עוד לא הספיק להסתכל עליה היתה נכנסת ללוח לבד בטעינה הבאה. */
  const pend=QUEUE.filter(it=>!it.k&&it.okd&&
    ((it.link&&it.link!=='new')||(it.note||'').trim()));
  if(!pend.length)return;
  let changed=false;
  for(const it of pend){
    /* רק אם התמונה באמת שם. תור מקומי יכול להצביע על העלאה שנכשלה,
       וסעיף בלוח עם אטב שלא נפתח גרוע מסעיף חסר. */
    const has=await getJSON(FTHUMB+'/'+it.fid+'.json')||await getJSON(FDATA+'/'+it.fid+'.json');
    if(!has)continue;
    const k=it.link&&it.link!=='new'?it.link:null;
    if(await(k?attachOne(it):commitOne(it)))changed=true;
  }
  if(changed){ saveQueue(); render(); }
}

/* ===== תמונות שעלו ואין להן פרטים: שחזור מהמסד =====
   התור המקומי הוא נוחות, לא מקור האמת. הוא נמחק בניקוי הדפדפן, הוא לא
   קיים במכשיר אחר, ועד הגרסה הזאת הוא נמחק גם בלחיצה על ״עוד תמונות״.
   מקור האמת הוא המסד: קובץ שאין לו פריט בסדר היום ואין לו מטא-דאטה הוא
   תמונה שהועלתה ולא נקשרה לשום דבר. השחזור הזה הוא גם הדרך היחידה
   להחזיר את מה שכבר אבד — 12 התמונות שנעלמו מהמסך ונשארו במסד. */
const fidAt=f=>{ const n=parseInt(String(f).slice(1,-5),36);
  return n>16e11&&n<4e12?n:0; };
let OLDER=0;
async function adoptOrphans(days){
  const [th,fl,fm]=await Promise.all([
    getJSON(FTHUMB+'.json?shallow=true'),
    getJSON(FDATA+'.json?shallow=true'),
    getJSON(FMETA+'.json')]);
  /* בלי המטא ובלי המשימה אין איך להבדיל בין תמונה יתומה לתמונה שמחוברת
     לסעיף — ואימוץ תמונה מחוברת היה יוצר לה סעיף שני. מוטב לא לעשות כלום. */
  if(fm===null||!TASKOBJ||(!fl&&!th))return {added:0,older:0};
  const used={};
  (TASKOBJ.items||[]).forEach(i=>{ if(i&&i.fid)used[i.fid]=1; });
  if(typeof fm==='object')Object.keys(fm).forEach(n=>{ const v=fm[n];
    if(v&&typeof v==='object')Object.keys(v).forEach(f=>{ used[f]=1; }); });
  QUEUE.forEach(x=>{ if(x&&x.fid)used[x.fid]=1; });
  const loose=Object.keys(Object.assign({},th||{},fl||{})).filter(f=>!used[f]);
  const cut=Date.now()-days*864e5;
  const back=loose.filter(f=>fidAt(f)>=cut).sort((a,z)=>fidAt(a)-fidAt(z));
  back.forEach(f=>QUEUE.push({fid:f,name:'',type:'image/jpeg',size:0,thumb:null,
    loc:'',loc2:'',note:'',k:null,at:fidAt(f),back:1}));
  if(back.length)saveQueue();
  OLDER=loose.length-back.length;
  return {added:back.length,older:OLDER};
}

/* ===== ניתוב ===== */
function render(){
  const app=$('#app'); app.innerHTML=''; app.className='';
  /* ההצעות נקבעות לפני הציור, כי כרטיס אחד מציג הצעה שתלויה בכרטיסים
     שלפניו (המיקום נגרר) ובמה שכבר הוצע לאחרים (סעיף לא מוצע פעמיים). */
  propose();
  if(VIEW==='doc')return renderDoc(app);
  if(VIEW==='gaps')return renderGaps(app);
  if(QUEUE.length||FAILED.length)return renderReview(app);
  renderStart(app);
}
$('#lb').onclick=()=>$('#lb').classList.remove('on');
Promise.all([loadTask(),loadLocs()]).then(()=>{
  /* תור ששרד רענון מחזיר אותו בדיוק למקום שבו נעצר. בלי הודעה זה נראה
     כאילו הדף נפתח במקום מוזר, ולכן אומרים לו מה קרה. */
  /* נטען גם בתצוגת המסמך — אחרת המסמך לא יודע שיש תמונות פתוחות
     ולא יכול להציע את הדרך חזרה אליהן. ההודעה עצמה רק במסך התמונות. */
  const resumed=loadQueue();
  if(VIEW!=='doc'&&resumed)
    toast(`חזרנו לאן שהפסקת — ${QUEUE.filter(x=>!x.k).length} מתוך ${QUEUE.length} עוד מחכות לפרטים`,4000);
  render();
  retryPending();
  /* אחרי הציור הראשון ולא לפניו: המסך לא צריך לחכות לשתי קריאות רשת
     כדי להראות את מה שכבר שמור במכשיר. */
  adoptOrphans(7).then(o=>{
    if(o.added){ render();
      if(VIEW!=='doc')toast(`${o.added} תמונות שעלו ולא נקשרו לשום סעיף הוחזרו למסך`,5000); }
    else if(o.older&&VIEW==='gaps')render();
  });
});
</script>
