<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ליקויים — הבית שלנו</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{
  --paper:#FBFAF5; --card:#fff; --ink:#2C2A26; --muted:#7D7A70;
  --line:#E6E3D7; --line2:#D5D1C0;
  --olive:#6C7A44; --olive-ink:#4E5A2E; --olive-soft:#EFF1E2;
  --red:#C0452F; --red-soft:#FBEDEA;
  --amber:#B4832B; --amber-soft:#FBF2DF;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1A1917; --card:#232220; --ink:#ECE9E0; --muted:#9B968A;
  --line:#333230; --line2:#444240;
  --olive:#9DAE6E; --olive-ink:#B6C586; --olive-soft:#2A2E22;
  --red:#E07A63; --red-soft:#33211D; --amber:#D7A64A; --amber-soft:#2F2819;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.55 Assistant,-apple-system,"system-ui","Segoe UI",Arial,sans-serif;
  padding:0 15px calc(44px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto}
header{padding:20px 0 8px}
h1{font-family:Karantina,Assistant,sans-serif;font-weight:700;font-size:36px;line-height:1;margin:0 0 5px}
.lede{color:var(--muted);font-size:14.5px;margin:0}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:13px;font-weight:600;margin:0 0 0 6px}
.pill.ok{background:var(--olive-soft);border-color:var(--olive);color:var(--olive-ink)}
.pill.hot{background:var(--red-soft);border-color:var(--red);color:var(--red)}

/* ===== מסך ההעלאה — זה מה שרועי רואה ראשון ===== */
.drop{display:block;border:2.5px dashed var(--olive);border-radius:20px;background:var(--olive-soft);
  color:var(--olive-ink);text-align:center;padding:44px 18px;cursor:pointer;margin:18px 0 10px;
  font-weight:800;font-size:20px;transition:transform .12s}
.drop:active{transform:scale(.99)}
.drop small{display:block;font-weight:600;font-size:13.5px;color:var(--muted);margin-top:8px}
.drop input{display:none}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--olive);width:0;transition:width .25s}
.qline{font-size:13.5px;color:var(--muted);margin:6px 0 0;min-height:19px}
.qline.warn{color:#8d4428;background:#fbf0ec;border:1px solid #c6836b;
  border-radius:10px;padding:9px 11px;line-height:1.5}

/* ===== מסך המעבר תמונה-תמונה ===== */
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.stephd{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.stephd .cnt{font-weight:800;font-size:15px}
.stephd .rest{color:var(--muted);font-size:13px;margin-right:auto}
.shot{width:100%;max-height:44vh;object-fit:contain;background:var(--line);border-radius:12px;
  border:1px solid var(--line);display:block;cursor:zoom-in}
.fld{margin:13px 0 0}
.fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;padding:10px 11px;font:inherit;font-size:16px}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--olive)}

/* בוחר המיקום — נקישה ולא הקלדה. ההקלדה רק מסננת. */
.locnow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.locnow b{background:var(--olive);color:#fff;border-radius:999px;padding:7px 14px;font-size:15px}
.locnow button{border:none;background:transparent;color:var(--muted);font:inherit;font-size:13px;
  text-decoration:underline;cursor:pointer;padding:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap;max-height:188px;overflow:auto;
  -webkit-overflow-scrolling:touch;padding:2px 0 4px}
.chips button{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;
  padding:9px 13px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-align:right}
.chips button:active{transform:scale(.98)}
.chips button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.chips button.new{border-style:dashed;border-color:var(--olive);color:var(--olive-ink);font-weight:800}
.locsearch{margin:0 0 8px}
.combo{display:flex;gap:6px;align-items:stretch}
.combo input{flex:1;min-width:0}
.combo .ddbtn{flex:0 0 auto;font:inherit;font-size:15px;font-weight:800;padding:0 14px;border-radius:9px;
  border:1px solid var(--line2);background:var(--card);color:var(--olive-ink);cursor:pointer}
.combo .ddbtn[aria-expanded=true]{background:var(--olive);color:#fff;border-color:var(--olive)}
.ddlist{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto;margin:0 0 8px;padding:6px;
  border:1px solid var(--line2);border-radius:10px;background:var(--card)}
.ddlist[hidden]{display:none}
.ddlist .ddrow{font:inherit;font-size:13.5px;text-align:right;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ddlist .ddrow:hover{background:var(--olive-soft)}
.ddlist .ddrow.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.tapedit.match .lnkhd{font-size:11.5px;font-weight:800;color:var(--muted)}

.go{display:block;width:100%;border:none;border-radius:13px;background:var(--olive);color:#fff;
  padding:15px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;margin:14px 0 0}
.go[disabled]{opacity:.5}
.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.row2{display:flex;gap:9px;margin-top:10px}
.row2 .go{margin-top:0}
.empty-state{text-align:center;color:var(--muted);padding:34px 10px;font-size:15px}

/* ===== המסמך ===== */
.doc h2{font-size:21px;margin:26px 0 4px;padding-bottom:5px;border-bottom:2px solid var(--olive);
  color:var(--olive-ink);font-family:Karantina,Assistant,sans-serif;letter-spacing:.01em}
.doc h3{font-size:16px;margin:16px 0 8px;color:var(--ink);background:var(--olive-soft);
  padding:6px 11px;border-radius:9px}
.lk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  margin:0 0 11px;display:flex;gap:12px;align-items:flex-start;break-inside:avoid}
.lk .n{flex:0 0 auto;width:25px;height:25px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-weight:800;font-size:12.5px}
.lk .ph{flex:0 0 auto;width:150px}
.lk .ph img{width:150px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
  background:var(--line);display:block;cursor:zoom-in}
.lk .ph .nofile{width:150px;height:150px;border-radius:10px;border:1px dashed var(--line2);
  display:grid;place-items:center;color:var(--muted);font-size:12px}
.lk .body{flex:1;min-width:0}
.lk .where{font-weight:800;font-size:15px;margin:0 0 3px}
.lk .where span{color:var(--olive-ink)}
.lk .what{font-size:15px;margin:0}
.lk.fixed{opacity:.5}
.lk .mini{font-size:12.5px;color:var(--muted);margin-top:5px}

.tabs{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.tabs a{border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;
  border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.tabs a.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:11px;padding:10px 12px;
  font-size:13.5px;color:var(--ink);margin:12px 0}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom));margin-inline:auto;
  width:max-content;max-width:90%;background:var(--ink);color:var(--paper);padding:11px 19px;
  border-radius:999px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
/* ===== עריכה בתוך המסמך =====
   הטקסט הוא הכפתור. נגיעה בו פותחת עורך במקום, ו-✓ / ✕ סוגרים אותו.
   כך אין שדות טופס שמתחרים בתצוגה, והמסך נקרא כמו המסמך הסופי. */
.lk.card{align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin:10px 0}
.tapedit{display:block;width:100%;text-align:right;font:inherit;font-weight:inherit;
  color:inherit;background:transparent;border:none;border-radius:8px;padding:5px 7px;
  margin:-5px -7px;cursor:pointer;line-height:1.5}
.tapedit:hover{background:var(--olive-soft)}
.tapedit.ghosttxt{color:var(--muted);font-weight:600;border:1px dashed var(--line2);
  margin:0;padding:7px 9px}
/* ״מוצע״ חייב להיראות אחרת ממה שאושר, אחרת רועי לא יוכל לדעת מה הוא
   אישר ומה הדף ניחש בשמו. ענבר רך, ולא אדום: זו הצעה ולא בעיה. */
.sugtag{font-size:11px;font-weight:800;background:var(--amber-soft);color:var(--amber);
  border:1px solid var(--amber);border-radius:999px;padding:1px 7px;margin-inline-start:6px;
  vertical-align:middle;white-space:nowrap}
.pill.sug{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.lk .where2{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.lk .lnk{margin:5px 0 0;font-size:14px}
.tapedit.match{font-weight:700;color:var(--olive-ink);background:var(--olive-soft);
  border:1px solid var(--line2);margin:0;padding:7px 9px}
.tapedit.sublnk{font-size:13px;color:var(--muted);font-weight:600}
.tapedit.sublnk u{color:var(--olive-ink)}
.sughd{margin:0 0 6px;font-size:12.5px;font-weight:800;color:var(--muted)}
.tapedit.needloc{color:var(--red);font-weight:800;border:1px dashed var(--red);
  background:var(--red-soft);margin:0;padding:7px 9px}
.lk .ed{margin:6px 0 2px}
.okrow{display:flex;gap:7px;margin-top:8px}
.mini{font:inherit;font-size:13px;font-weight:700;padding:7px 13px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.mini:hover{border-color:var(--olive);color:var(--olive-ink)}
.mini.go2{background:var(--olive);color:#fff;border-color:var(--olive)}
.lk .st{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
/* הודעת כשל שנשארת עד שמסירים אותה במפורש */
.gaprow{border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:11px 13px;margin:8px 0}
.gaprow .txt{margin:0 0 9px;font-size:14.5px;font-weight:600;line-height:1.5}
.gaprow .miniph{float:inline-start;width:74px;height:74px;margin-inline-end:11px;
  border-radius:9px;overflow:hidden;background:var(--olive-soft)}
.gaprow .miniph img{width:100%;height:100%;object-fit:cover;display:block}
.gaprow .ln{margin:7px 0 0;font-size:13px;color:#8d4428}
.addph{display:inline-block;border:1px dashed var(--line2);border-radius:9px;padding:7px 13px;
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.addph:hover{border-color:var(--olive);color:var(--olive-ink);background:var(--olive-soft)}
.addph input{display:none}
.fails{border:1px solid #c6836b;background:#fbf0ec;border-radius:12px;padding:11px 13px;margin:10px 0}
.fails .hd{margin:0 0 6px;font-weight:800;color:#8d4428}
.fails .ln{margin:0 0 4px;font-size:13.5px;color:#6b3a26}
/* טוסט שמפרט מה נכשל הוא כמה שורות ולא מילה. גלולה צרה היתה הופכת אותו
   לבלתי קריא, ולכן רשימה מקבלת צורה של פתק. */
.toast.multi{border-radius:14px;white-space:pre-line;text-align:right;
  font-weight:600;line-height:1.55;font-size:14px;max-width:min(94%,420px)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:80;padding:12px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:92vh;border-radius:10px}
@media print{
  body{background:#fff;padding:0;color:#000}
  .tabs,.drop,.go,.row2,.noprint,.note{display:none!important}
  .lk{break-inside:avoid;border-color:#bbb;background:#fff}
  .doc h2{color:#000;border-bottom-color:#666}
  .doc h3{background:#eee;color:#000}
  .lk .ph,.lk .ph img{width:210px;height:auto}
  .lk .ph img{max-height:260px;object-fit:contain;background:#fff}
}
@media (max-width:560px){
  .lk{flex-wrap:wrap}
  .lk .ph,.lk .ph img,.lk .ph .nofile{width:100%;height:auto}
  .lk .ph img{height:auto;max-height:300px;object-fit:contain;background:var(--paper)}
  .chips{max-height:220px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">ליקויים</h1>
    <p class="lede" id="lede">הבית שלנו</p>
  </header>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<script>
/* ===== אחסון =====
   אותו Firebase שהלוח עובד מולו. Storage לא מופעל בפרויקט (Spark), ולכן
   התמונה נשמרת כ-dataURL מוקטן. שלושה צמתים, לפי מה שנטען מתי:
     board/files/<fid>    — התמונה המלאה 1600px. נטענת רק בלחיצה ובהדפסה.
     board/thumbs/<fid>   — 240px ~15KB. זה מה שהמסמך מציג על המסך.
     board/filemeta/...   — מטא-דאטה בלבד, בלי שום תמונה. נטען במלואו
                            בכל טעינה של הלוח, ולכן כל בייט בו יקר.
   הליקוי עצמו הוא פריט ב-items של המשימה, ולא רשומה נפרדת — כך הוא חי
   בתוך סדר היום מול ברק, והלוח מציג אותו בלי שינוי בקוד שלו. */
const DB='https://home-picks-47450-default-rtdb.europe-west1.firebasedatabase.app';
const TASK='ong-barak';
const TNODE=DB+'/board/tasks/'+TASK;
const FMETA=DB+'/board/filemeta', FDATA=DB+'/board/files', FTHUMB=DB+'/board/thumbs';
const LOCS=DB+'/board/locs';
const MAXB=700*1024;

/* רשימת ברירת המחדל כפי שיעל כתבה אותה. מיקום שרועי מוסיף נשמר
   ב-board/locs ומוצע לו שוב בפעם הבאה. */
const LOC0=['קומה עליונה - חדר הורים','קומה עליונה - חדר רחצה','קומה עליונה - פינת עבודה',
  'קומה עליונה - פינת משפחה','קומה עליונה - מרפסת','מדרגות','קומה תחתונה - סלון',
  'קומה תחתונה - כניסה','קומה תחתונה - ממ״ד','קומה תחתונה - חדר אורחים',
  'קומה תחתונה - חדר רחצה אורחים','קומה תחתונה - חדר רחצה כללי','קומה תחתונה - מטבח',
  'קומה תחתונה מתחת למדרגות','קומה תחתונה - מזדרון','קומה תחתונה - חדר ילדים',
  'חצר - צד מזרחי','צד מערבי','צד צפוני (גינה אחורית)','צד דרומי (גינה קדמית)','חנייה'];

const qs=new URLSearchParams(location.search);
const VIEW=qs.get('v')||'';

const $=s=>document.querySelector(s);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;
function toast(m,ms){const t=$('#toast');t.textContent=m;
  t.classList.toggle('multi',/\n/.test(m));t.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms||2200);}

/* רשת נופלת מדי פעם, ולכן כל כתיבה מנסה שוב ולא נעלמת בשקט */
async function put(url,body,method){
  for(let a=0;a<4;a++){
    try{
      const r=await fetch(url,{method:method||'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)});
      if(r.ok)return true;
    }catch(e){}
    await new Promise(r=>setTimeout(r,900*(a+1)));
  }
  return false;
}
async function getJSON(url){
  /* מפריד נכון גם לכתובת שיש בה כבר שאילתה (shallow), אחרת היא נשברת */
  const sep=url.indexOf('?')>=0?'&':'?';
  try{const r=await fetch(url+sep+'t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null;}
  catch(e){return null;}
}

/* תמונה מהנייד היא 4–12 מגה. בלי הקטנה היא לא נכנסת ל-Realtime DB.

   השחרור המפורש בסוף אינו ניקיון יופי: ספארי באייפון מחזיק את התמונה
   המפוענחת (12MP ≈ 48MB לא דחוסים) ואת ה-canvas עד שהאוסף רץ, ולולאה
   של עשרות תמונות חוצה את תקרת הזיכרון של הטאב — והטאב נהרג בשקט,
   בלי שגיאה ובלי הודעה. אפס לרוחב ולגובה מחזיר את ה-canvas מיד. */
/* פענוח אחד, שני גדלים.

   קודם זה היה פענוח כפול: הקטנה ל-1600, ואז פענוח מחדש של התוצאה כדי
   להכין ממוזערת. הפענוח השני הוא שנפל — 15 מתוך 23 תמונות שרועי העלה
   הגיעו למסד בלי ממוזערת, ואז נשאר ריבוע ריק במקום תמונה. הפענוח הוא
   גם החלק היקר, ולכן ציור שני גדלים מאותה תמונה מפוענחת מהיר יותר
   וגם עמיד יותר. */
function shrink(file){
  return new Promise(res=>{
    /* פעם התנאי היה ש-type חייב להתחיל ב-image/. זה נראה הגיוני והוא
       הגורם ל״תמונה גדולה מדי שלא עלתה״: iOS מוסר קבצים עם type ריק או
       application/octet-stream, ואז לא ניסינו לפענח בכלל, נפלנו לקידוד
       הקובץ הגולמי ל-base64, והוא נדחה על הגודל. עכשיו פשוט מנסים —
       הדפדפן הוא זה שיודע אם זו תמונה, לא התווית שהגיעה איתה. */
    if(/pdf|svg/i.test(file.type)||/\.(pdf|svg)$/i.test(file.name||''))return res(null);
    const img=new Image(),url=URL.createObjectURL(file);
    /* ספארי באייפון מחזיק את התמונה המפוענחת (12MP ≈ 48MB לא דחוסים)
       ואת ה-canvas עד שהאוסף רץ, ולולאה של עשרות תמונות חוצה את תקרת
       הזיכרון של הטאב — והטאב נהרג בשקט. אפס לרוחב ולגובה מחזיר מיד. */
    const done=(cs,val)=>{
      cs.forEach(c=>{ if(c)c.width=c.height=0; });
      img.onload=img.onerror=null; img.removeAttribute('src');
      URL.revokeObjectURL(url); res(val);
    };
    img.onload=()=>{
      const draw=max=>{
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        return c;
      };
      let cf=null,ct=null;
      /* toDataURL נופל כשהזיכרון נגמר. בלי try השגיאה היתה בורחת
         מה-Promise והלולאה כולה היתה נתקעת בלי להיפתר ובלי להיכשל. */
      try{
        cf=draw(1600); const full=cf.toDataURL('image/jpeg',0.72);
        /* כישלון של הממוזערת לבדה אינו סיבה לאבד את התמונה: היא רק
           חוסכת מכסת הורדה, והתצוגה יודעת ליפול חזרה למלאה. */
        let thumb=null;
        try{ ct=draw(240); thumb=ct.toDataURL('image/jpeg',0.6); }catch(e){}
        done([cf,ct],{full,thumb});
      }catch(e){ done([cf,ct],null); }
    };
    img.onerror=()=>done([],null);
    img.src=url;
  });
}
/* ===== HEIC =====
   זה פורמט ברירת המחדל של האייפון, ושום דפדפן מלבד ספארי לא מפענח אותו.
   בדקתי: גם <img> וגם createImageBitmap נכשלים בכרום על HEIC אמיתי,
   ולכן נדרשת ספרייה. היא יושבת בריפו ולא ב-CDN — בשטח, ברשת סלולרית
   חלשה, תלות בשרת זר היא עוד נקודת כשל — ונטענת רק כשבאמת נתקלים
   ב-HEIC, כך שצילום רגיל לא משלם עליה כלום. */
let HEICLIB=null, HEICFAIL=false;
const looksHeic=f=>/hei[cf]/i.test(f.type||'')||/\.(heic|heif)$/i.test(f.name||'');
const heicNote=f=>looksHeic(f)?'קובץ HEIC שההמרה שלו נכשלה — שמרי אותו כ-JPEG ונסי שוב':'';
async function loadHeic(){
  if(HEICLIB)return HEICLIB;
  if(HEICFAIL)return null;
  if(window.heic2any)return (HEICLIB=window.heic2any);
  try{
    await new Promise((res,rej)=>{ const s=document.createElement('script');
      s.src='vendor/heic2any.min.js'; s.onload=res;
      s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); });
    HEICLIB=window.heic2any||null;
  }catch(e){ HEICLIB=null; }
  if(!HEICLIB)HEICFAIL=true;
  return HEICLIB;
}
async function heicToJpeg(file){
  try{
    const lib=await loadHeic(); if(!lib)return null;
    const out=await lib({blob:file,toType:'image/jpeg',quality:0.92});
    const b=Array.isArray(out)?out[0]:out;
    if(!b)return null;
    return new File([b],(file.name||'photo').replace(/\.(heic|heif)$/i,'')+'.jpg',{type:'image/jpeg'});
  }catch(e){ return null; }
}

const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';

/* ===== מצב ===== */
let TASKOBJ=null;        /* המשימה החיה */
let LOCLIST=LOC0.slice(); /* ברירות מחדל + מה שרועי הוסיף */
let QUEUE=[];            /* התמונות שהועלו — עם פרטים או בלי */
let lastLoc='';          /* המיקום האחרון — ברוב הסיור הוא לא משתנה */
let FAILED=[];           /* קבצים שלא עלו, נשארים על המסך עד שמסירים */
let HIDEOK=false;        /* קיפול של מה שכבר אושר */

/* ===== התור שורד רענון =====
   התמונה כבר יושבת ב-Firebase ברגע שהפס הגיע לסוף, אבל הקישור בינה לבין
   הליקוי נוצר רק כשממלאים מיקום והסבר. אם הטאב נהרג באמצע — ובאייפון עם
   עשרות תמונות ורשת סלולרית זה קורה — התור נעלם והתמונות נשארות יתומות
   במסד בלי שאיש יודע עליהן. לכן התור נשמר מקומית אחרי כל צעד, וזה גם מה
   שמאפשר לחזור לשלב האחרון אחרי יציאה ללוח ובחזרה.
   נשמרים רק המפתחות: הממוזערת נמשכת בחזרה מהמסד לפי הצורך, וכך תור של
   70 תמונות תופס עשרות בתים לפריט במקום להתנגש בתקרת האחסון של הדפדפן. */
const QKEY='lik_queue_v2';
function saveQueue(){
  try{
    if(!QUEUE.length)return localStorage.removeItem(QKEY);
    const slim=QUEUE.map(x=>({fid:x.fid,name:x.name,type:x.type,size:x.size,
      loc:x.loc||'',loc2:x.loc2||'',note:x.note||'',k:x.k||null,at:x.at||0,
      back:x.back?1:0,link:x.link||null,okd:x.okd?1:0,
      tgt:x.tgt||null,moved:x.moved||null}));
    localStorage.setItem(QKEY,JSON.stringify({q:slim,at:Date.now()}));
  }catch(e){}
}
function loadQueue(){
  try{
    let j=JSON.parse(localStorage.getItem(QKEY)||'null');
    /* התור של הגרסה הקודמת. לרועי יש בטלפון תור כזה עם תמונות שכבר
       עלו למסד ועוד לא קושרו לליקוי — התעלמות ממנו היתה הופכת אותן
       ליתומות לצמיתות. ה-i הישן היה סמן מיקום באשף ואין לו מקום כאן. */
    if(!j){
      const old=JSON.parse(localStorage.getItem('lik_queue_v1')||'null');
      if(old&&Array.isArray(old.q)&&old.q.length){
        j={q:old.q.map(x=>Object.assign({k:null,at:0},x)),at:old.at||Date.now()};
        /* נכתב מיד ורק אז נמחק הישן. הפוך, סגירת הטאב בין השניים היתה
           מוחקת את התור הישן בלי שהחדש נכתב אי פעם. */
        try{ localStorage.setItem(QKEY,JSON.stringify(j));
             localStorage.removeItem('lik_queue_v1'); }catch(e){}
      }
    }
    if(!j||!Array.isArray(j.q)||!j.q.length)return false;
    /* תור בן יומיים הוא שאריות, לא עבודה באמצע. מספיק רחב לסיור שנמשך
       מערב לבוקר, וצר מספיק כדי לא לקפוץ בהפתעה שבוע אחרי. */
    if(Date.now()-(j.at||0)>2*864e5){ localStorage.removeItem(QKEY); return false; }
    QUEUE=j.q;
    return true;
  }catch(e){ return false; }
}
function clearQueue(){ QUEUE=[]; FAILED=[]; try{localStorage.removeItem(QKEY);}catch(e){} }

async function loadTask(){ TASKOBJ=await getJSON(TNODE+'.json'); return TASKOBJ; }
async function loadLocs(){
  const j=await getJSON(LOCS+'.json');
  const extra=Array.isArray(j)?j:(j&&typeof j==='object'?Object.values(j):[]);
  const seen={};
  LOCLIST=LOC0.concat(extra.filter(Boolean)).filter(x=>{
    const k=String(x).trim(); if(!k||seen[k])return false; seen[k]=1; return true;});
}
async function rememberLoc(name){
  const n=String(name||'').trim(); if(!n||LOC0.indexOf(n)>=0)return;
  const j=await getJSON(LOCS+'.json');
  const cur=Array.isArray(j)?j:(j&&typeof j==='object'?Object.values(j):[]);
  if(cur.indexOf(n)>=0)return;
  cur.push(n);
  await put(LOCS+'.json',cur);
  if(LOCLIST.indexOf(n)<0)LOCLIST.push(n);
}

/* ===== כתיבה בטוחה אל items =====
   ל-ong-barak יש 47 פריטים חיים שיעל ורועי מסמנים תוך כדי. PUT של
   המשימה כולה היה דורס סימון שנעשה בשנייה שלפני. לכן: למשוך את המערך
   החי ברגע השמירה, לצרף רק את מה שחדש לפי k, ולכתוב רק את items.

   עריכה חוזרת של אותו ליקוי מעדכנת את הפריט הקיים לפי k ולא מוסיפה
   כפילות — בלי זה, כל תיקון של ניסוח היה יוצר סעיף חדש בלוח. */
async function upsertItem(item,tid,allowEmpty){
  /* ברירת המחדל היא סדר היום מול ברק. עם tid כותבים לסעיפים של משימה אחרת
     בלוח — אותו כלל בטיחות: מושכים את המערך החי, מוסיפים לפי k, כותבים רק items. */
  const node=tid&&tid!==TASK?DB+'/board/tasks/'+encodeURIComponent(tid):TNODE;
  const live=await getJSON(node+'/items.json');
  /* Firebase מחזיר מערך צפוף כמערך, ומערך עם חורים כאובייקט ממופתח.
     שתי הצורות חייבות להתקבל — אחרת קריאה תקינה בצורה השנייה היתה
     נראית כמו ״אין פריטים״, והכתיבה שאחריה היתה מוחקת את כולם. */
  let base=null;
  if(Array.isArray(live))base=live.filter(x=>x);
  else if(live&&typeof live==='object')base=Object.keys(live)
    .sort((a,z)=>(+a)-(+z)).map(k=>live[k]).filter(x=>x);
  /* משימה שעוד אין לה סעיפים מחזירה null בדיוק כמו רשת שנפלה. כשמותר
     (משימה אחרת), מבדילים ביניהם: אם הכותרת של המשימה נקראת — היא קיימת
     והרשת חיה, והמערך פשוט עוד ריק. */
  if(!base&&allowEmpty&&live===null){
    const ttl=await getJSON(node+'/title.json');
    if(ttl)base=[];
  }
  /* קריאה שנכשלה מחזירה null. במצב הזה אסור לכתוב: מערך חדש עם פריט
     אחד היה מוחק 47 פריטים חיים. עדיף להיכשל גלוי ושהוא ינסה שוב. */
  if(!base){ toast('אין חיבור — הפרטים לא נשמרו, נסה שוב'); return false; }
  const at=base.findIndex(x=>x&&x.k===item.k);
  let arr;
  if(at>=0){
    /* קיים — מחליפים במקום, ושומרים על done ו-ans שנקבעו בלוח עצמו
       כדי שעריכת ניסוח לא תפתח מחדש סעיף שכבר נסגר. */
    arr=base.slice();
    arr[at]=Object.assign({},base[at],item,
      {done:base[at].done,ans:base[at].ans});
  } else {
    arr=base.concat([item]);
    if(arr.length<=base.length)return false;
  }
  const ok=await put(node+'/items.json',arr);
  if(ok){ await put(node+'/updatedAt.json',Date.now()); if(node===TNODE&&TASKOBJ)TASKOBJ.items=arr; }
  return ok;
}

/* ===== העלאה ===== */
async function addFiles(files,onProg,onOne){
  const arr=[...files]; let ok=0; const bad=[];
  const nameOf=f=>f.name||'קובץ';
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    onProg(i,arr.length,f.name);
    let shrunk=await shrink(f);
    /* פורמט שהדפדפן לא פענח לבדו — באייפון ובמק זה HEIC. המפענח נטען
       רק עכשיו, כלומר רק למי שבאמת נתקל בו, ולא לכל צילום רגיל. */
    if(!shrunk&&looksHeic(f)){
      onProg(i,arr.length,(f.name||'')+' — ממיר HEIC…');
      const jpg=await heicToJpeg(f);
      if(jpg)shrunk=await shrink(jpg);
    }
    let data=shrunk?shrunk.full:null, th=shrunk?shrunk.thumb:null;
    const isImg=!!shrunk;
    if(!data){
      /* לא נפתח כתמונה. קריאת המקור הגולמי משתלמת רק ל-PDF קטן; אחרת
         זה מגהבייטים של base64 בדרך לדחייה ודאית, על חשבון הזיכרון של
         התמונות שאחריו בתור. */
      if(f.size>MAXB){ bad.push({n:nameOf(f),w:heicNote(f)||'לא נפתח כתמונה, והקובץ גדול מכדי להישמר כמו שהוא'}); continue; }
      try{ data=await readURL(f); }catch(e){ bad.push({n:nameOf(f),w:'הקריאה מהמכשיר נכשלה'}); continue; }
      if(data.length>MAXB*1.4){ bad.push({n:nameOf(f),w:heicNote(f)||'לא נפתח כתמונה, והקובץ גדול מדי'}); continue; }
    }
    const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    if(!await put(FDATA+'/'+fid+'.json',{data})){ bad.push({n:nameOf(f),w:'הרשת נפלה באמצע ההעלאה'}); continue; }
    if(th&&!await put(FTHUMB+'/'+fid+'.json',{data:th}))th=null;
    const sz=data.length; data=null;
    ok++;
    /* נרשם מיד ולא בסוף: אם הטאב ייפול בתמונה 40, ה-39 שלפניה כבר
       בתור השמור וההמשך ימשיך מהן במקום להתחיל מאפס. */
    onOne({fid,name:f.name||'',type:isImg?'image/jpeg':(f.type||'application/octet-stream'),
           size:sz,thumb:th,loc:'',loc2:'',note:''});
  }
  return {ok,bad};
}

function mkDrop(after){
  const d=el(`<label class="drop">📷 צילום או בחירת תמונות
    <small>אפשר לבחור כמה ביחד · אחר כך רואים את כולן יחד וממלאים פרטים</small>
    <input type="file" multiple accept="image/*,application/pdf,.pdf,.heic,.heif"></label>`);
  const bar=el('<div class="bar"><i></i></div>'); bar.style.display='none';
  const q=el('<p class="qline"></p>');
  const wrap=el('<div></div>'); wrap.appendChild(d); wrap.appendChild(bar); wrap.appendChild(q);
  const run=async fs=>{
    /* בחירה שלא הגיעה אל כאן חייבת להיראות על המסך. רועי בחר 106 תמונות,
       לחץ ✓ ולא קרה כלום — ואי אפשר היה לדעת אם הדף עובד, אם הוא תקוע או
       אם הטלפון בכלל מסר את הקבצים. שורה אחת פה עולה כלום ואומרת מה קרה. */
    if(!fs||!fs.length){
      q.innerHTML='<b>הטלפון לא העביר אף תמונה.</b> זה קורה בבחירה גדולה מאוד — '+
        'נסה שוב עם 10–15 תמונות בכל פעם.';
      q.className='qline warn';
      return;
    }
    q.className='qline';
    /* נכתב מיד, לפני הפענוח הראשון: בבחירה של עשרות תמונות אייפון שוהה
       שניות ארוכות לפני התמונה הראשונה, וללא שורה כזאת המסך דומם. */
    q.textContent=`התקבלו ${fs.length} תמונות — מתחיל…`;
    bar.style.display='block';
    const res=await addFiles(fs,(i,n,nm)=>{
      bar.querySelector('i').style.width=Math.round(i/n*100)+'%';
      q.textContent=`מעלה ${i+1} מתוך ${n} — ${nm}`;
    /* נדחף לתור הקיים ולא מאפס אותו: אצווה שנייה מצטרפת לראשונה
       במקום למחוק אותה ולהשאיר את הקבצים שלה יתומים במסד. */
    },it=>{ QUEUE.push(it); saveQueue(); });
    bar.style.display='none'; q.textContent='';
    /* הכשלים עוברים למצב ומוצגים במסך עצמו. טוסט שנעלם פירושו שפורמט
       שלם יכול להיכשל בלי שאיש ישים לב — וזה בדיוק מה שקרה עם HEIC. */
    if(res.bad.length)FAILED=FAILED.concat(res.bad);
    if(res.ok)toast(`${res.ok} תמונות עלו ✓`);
    if(after)after();
  };
  /* e.target.files הוא רפרנס חי ל-FileList של ה-input, ואיפוס value
     מרוקן אותו. בכרום הרפרנס הישן שורד, ובספארי באייפון הוא מתאפס
     לאורך 0 — ואז run יוצא מיד, בלי פס ובלי טוסט. בדיוק מה שקרה לרועי
     עם 69 תמונות: הוא לחץ ✓ ולא קרה כלום. ההעתקה למערך מנתקת אותנו
     מה-input לפני האיפוס. */
  d.querySelector('input').onchange=e=>{ const fs=[...e.target.files]; e.target.value=''; run(fs); };
  ['dragover','dragenter'].forEach(ev=>d.addEventListener(ev,x=>{x.preventDefault();d.style.transform='scale(1.01)';}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,x=>{x.preventDefault();d.style.transform='';}));
  d.addEventListener('drop',x=>{ run(x.dataTransfer&&x.dataTransfer.files); });
  return wrap;
}

/* ===== בוחר המיקום =====
   רועי ממלא את זה בשטח, בטלפון, ביד אחת. לכן המיקום נבחר בנקישה;
   ההקלדה רק מסננת, ומה שלא קיים אפשר להוסיף מאותו שדה. */
function locPicker(cur,onPick){
  const box=el('<div></div>');
  const now=el('<div class="locnow"></div>');
  const search=el('<div class="fld locsearch"><input placeholder="סינון, או מיקום חדש…" autocomplete="off"></div>');
  const chips=el('<div class="chips"></div>');
  const inp=search.querySelector('input');
  let picked=cur||'';

  const paintNow=()=>{
    now.innerHTML='';
    if(picked){
      now.appendChild(el(`<b>${esc(picked)}</b>`));
      const ch=el('<button type="button">שינוי</button>');
      ch.onclick=()=>{ picked=''; onPick(''); paint(); };
      now.appendChild(ch);
    }
  };
  const paintChips=()=>{
    const q=inp.value.trim();
    chips.innerHTML='';
    const list=LOCLIST.filter(l=>!q||l.indexOf(q)>=0);
    list.forEach(l=>{
      const b=el(`<button type="button" class="${l===picked?'on':''}">${esc(l)}</button>`);
      b.onclick=()=>{ picked=l; onPick(l); inp.value=''; paint(); };
      chips.appendChild(b);
    });
    if(q&&LOCLIST.indexOf(q)<0){
      const b=el(`<button type="button" class="new">➕ ${esc(q)}</button>`);
      b.onclick=async()=>{ picked=q; onPick(q); await rememberLoc(q); inp.value=''; paint();
        toast('המיקום נשמר ויוצע בפעם הבאה'); };
      chips.appendChild(b);
    }
    if(!list.length&&!q)chips.appendChild(el('<div class="empty-state">אין מיקומים</div>'));
  };
  const paint=()=>{ paintNow(); paintChips();
    search.style.display=picked?'none':'block';
    chips.style.display=picked?'none':'flex'; };
  inp.addEventListener('input',paintChips);
  box.appendChild(now); box.appendChild(search); box.appendChild(chips);
  paint();
  return box;
}

/* ===== שורת הניווט =====
   היא אחת לכל המסכים, כי שלוש גרסאות שונות של אותן לשוניות הן בדיוק
   איך שהדרך חזרה אל התמונות קיבלה את השם ״צילום״ ולא נראתה כמו הדרך
   חזרה. כשיש תמונות פתוחות הלשונית אומרת כמה, כדי שמי שנמצא במסמך
   יראה שיש לאן לחזור. */
function tabsEl(active){
  const n=QUEUE.length;
  const first=n?`התמונות <b>${n}</b>`:'צילום';
  const g=gapCount();
  const mk=(href,label,key)=>`<a href="${href}"${active===key?' class="on"':''}>${label}</a>`;
  return el(`<div class="tabs noprint">${
    mk('?',first,'shots')}${
    mk('?v=gaps',g?`חסרים <b>${g}</b>`:'חסרים','gaps')}${
    mk('?v=doc','המסמך','doc')}${
    mk('./','↩ ללוח','board')}</div>`);
}
/* שני סוגי חוסר, ושניהם מונעים מהמסמך להיות שלם: תמונה שהועלתה ואין לה
   עדיין מיקום והסבר, וסעיף פתוח בסדר היום שמתאר ליקוי בלי שיש לו תמונה. */
const gapShots=()=>QUEUE.filter(x=>!x.k);
const gapItems=()=>((TASKOBJ&&TASKOBJ.items)||[])
  .filter(i=>i&&!i.fid&&!i.done&&i.lv);
/* וסוג שלישי: ליקוי שכבר נשמר עם תמונה, ואין לו מיקום. מותר לשמור כך
   בשטח, אבל במסמך הוא נופל ל״בלי מיקום״ ואי אפשר למצוא אותו בבית. */
const gapLoc=()=>((TASKOBJ&&TASKOBJ.items)||[])
  .filter(i=>i&&i.fid&&!i.done&&!i.loc);
const gapCount=()=>gapShots().length+gapItems().length+gapLoc().length;

/* ===== התאמה לסעיפים שכבר רשומים =====
   רוב מה שרועי מצלם בסיור כבר כתוב בסדר היום מול ברק — ״למלא רובה
   בניקוז״, ״תיקון קירות בחדר הארונות״, ״רעש בצנרת״. תמונה שנכנסת
   כליקוי חדש יוצרת סעיף שני לאותו דבר, ואז יש בלוח שתי שורות לתיקון
   אחד. לכן לכל תמונה מוצע הסעיף הקיים שמתאים לה, והוא מה שהיא
   מצטרפת אליו — ומה שנכתב בסעיף נשאר כפי שהוא.

   אין כאן זיהוי תמונה, ואין בכלל כזה בדף. ההתאמה נשענת על שני דברים
   שאפשר לדעת בוודאות: המיקום שרועי בחר, וחפיפת מילים בין מה שהקליד
   לבין נוסח הסעיף. לכן זו הצעה שמסומנת כהצעה ולא קביעה. */
const STOP={'של':1,'את':1,'עם':1,'על':1,'אל':1,'לא':1,'זה':1,'מה':1,'או':1,'גם':1,
  'יש':1,'כל':1,'בכל':1,'לפני':1,'אחרי':1,'כדי':1,'אבל':1,'צריך':1,'אפשר':1,'עוד':1};
/* תחילית ה/ב/ל/מ/ש/כ וסיומת רבים הן הסיבה ש״הרחצה״ ו״רחצה״ לא נחשבו
   לאותה מילה. השוואה לפי גזע פותרת את זה בלי טבלת מילים. */
const stem=w=>w.replace(/^(ה|ב|ל|מ|ש|כ|ו)/,'').replace(/(ים|ות|יות)$/,'');
const hit=(a,b)=>{ const x=stem(a),y=stem(b);
  return x===y||(x.length>3&&y.indexOf(x)>=0)||(y.length>3&&x.indexOf(y)>=0); };
function toks(s){
  return String(s||'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}]/gu,' ')
    .replace(/[*·—–()\[\],.:;״"'?!]/g,' ')
    .split(/\s+/).filter(w=>w.length>2&&!STOP[w]);
}
/* מיקום הוא שם חדר, וסעיף מתאר עבודה. ״חדר רחצה״ לא מופיע בשום סעיף,
   אבל ״מקלחון״, ״ניקוז״ ו״רובה״ כן — ולכן המיקום מורחב למה שבאמת
   נכתב בסעיפים על אותו חדר. */
const SYN=[
  [/חדר רחצה|מקלחת/,['מקלחת','מקלחון','רחצה','ניקוז','רובה','אינטרפוץ','כיור','אמבטיה','ברזים','צנרת']],
  [/חדר הורים|הורים/,['הורים','שינה','ארונות','משקוף','קורות']],
  [/ארונות/,['ארונות','משקוף','קירות']],
  [/מטבח/,['מטבח','מקרר','כיור','ויטרינה','מדה','שיש','מזגן']],
  [/ממ.?ד/,['ממד','צבע','משקוף','מפתן','דלת']],
  [/מדרגות/,['מדרגות','רום','צוקל','שפכטל']],
  [/סלון|פינת משפחה/,['סלון','קורות','מזגן','גריל','פרקט']],
  [/חצר|^צד|גינה|פרגולה/,['חוץ','חצר','פרגולה','שליכט','יסודות','מרצפות','בלטה','בטון']],
  [/חנייה|חניה/,['חניה','חנייה','פרוזקטור','מצלמה']],
  [/כניסה/,['כניסה','משקוף','מפתן','שליכט']],
  [/ילדים/,['ילדים','אינטרפוץ','חלון']],
  [/מרפסת/,['מרפסת','שליכט','תריס']],
  [/אורחים/,['אורחים','שקע','טלוויזיה','כיור','לחץ']],
  [/עבודה|מזדרון|מסדרון/,['צבע','קורות','גבס']]
];
function locToks(loc){
  const s=String(loc||'');
  let out=toks(s.replace(/^(קומה עליונה|קומה תחתונה|חצר)\s*[-–]\s*/,''));
  SYN.forEach(([re,words])=>{ if(re.test(s))out=out.concat(words); });
  if(/עליונה/.test(s))out.push('למעלה');
  return out;
}
const itemByK=k=>((TASKOBJ&&TASKOBJ.items)||[]).find(i=>i&&i.k===k)||null;
const openItems=()=>((TASKOBJ&&TASKOBJ.items)||[]).filter(i=>i&&i.t&&!i.done&&!i.fid);
function candidates(loc,note,skip){
  const lt=locToks(loc), nt=toks(note);
  if(!lt.length&&!nt.length)return [];
  return openItems().filter(i=>!(skip&&skip[i.k])).map(i=>{
    const t=toks(i.t); let s=0;
    /* מה שהוקלד שוקל יותר מהחדר: החדר מצמצם לקבוצה, המילים מזהות סעיף. */
    lt.forEach(w=>{ if(t.some(x=>hit(x,w)))s+=2; });
    nt.forEach(w=>{ if(t.some(x=>hit(x,w)))s+=3; });
    return {i,s};
  }).filter(x=>x.s>1).sort((a,z)=>z.s-a.s).slice(0,4);
}
/* ההצעות נקבעות למערך כולו ולא לכרטיס אחד, משתי סיבות: המיקום נגרר
   מהתמונה הקודמת (בסיור מצלמים חדר שלם ברצף), וסעיף שהוצע לתמונה אחת
   לא מוצע שוב לתמונה הבאה — אחרת כל תמונות המקלחת מוצעות לאותה שורה. */
function propose(){
  let carry=lastLoc||'';
  const taken={};
  QUEUE.forEach(it=>{
    if(it.k){ if(it.loc)carry=it.loc; if(it.link)taken[it.link]=1; return; }
    if(it.loc)carry=it.loc; else it.sugLoc=carry||'';
    if(it.link)taken[it.link]=1;
  });
  QUEUE.forEach(it=>{
    if(it.k||it.link)return;
    const c=candidates(it.loc||it.sugLoc||'',it.note||'',taken);
    it.sugList=c.map(x=>x.i);
    /* רק התאמה טובה ממולאת מראש. בלי הרף הזה, התמונה החמישית באותו חדר
       היתה מקבלת את מה שנשאר בחדר — ומי שמאשר הכול בלחיצה אחת היה
       מצרף תמונה לסעיף שאין לו שום קשר אליה. מתחת לרף הסעיפים עדיין
       מוצעים ברשימה, רק לא נבחרים בשמו. */
    it.sugK=(c.length&&c[0].s>=6)?c[0].i.k:null;
    if(it.sugK)taken[it.sugK]=1;
  });
}

/* כרטיס תמונה אחד — אותו כרטיס משמש גם במסך ״התמונות״ וגם במסך
   ״חסרים״, כדי שהעריכה תתנהג זהה בשניהם. */
function shotCard(it,num){
  const c=el(`<div class="lk card"><span class="n">${num}</span>
    <div class="ph"></div><div class="body"></div></div>`);
  const ph=c.querySelector('.ph'), body=c.querySelector('.body');

  const im=el('<img alt="" loading="lazy">');
  ph.appendChild(im);
  /* הממוזערת לא נשמרת מקומית בכוונה, ולפעמים גם לא נוצרה בכלל כשהזיכרון
     בטלפון נגמר. fillThumb נופל חזרה לתמונה המלאה, ולכן תמיד רואים
     משהו — זה מה שהיה חסר כשנשאר ריבוע ריק. */
  if(it.thumb){ im.src=it.thumb;
    im.onclick=async()=>{ const j=await getJSON(FDATA+'/'+it.fid+'.json');
      const d=j&&(j.data||j);
      if(typeof d==='string'){ $('#lbimg').src=d; $('#lb').classList.add('on'); } };
  } else fillThumb(im,it.fid);

  /* מיקום.
     עד 20.11 היה כאן ✓/✕ משלו, ומעליו ✓ נוסף על הכרטיס. אותה מילה על
     שני כפתורים, ברמות שונות, במרחק שתי שורות — ואי אפשר היה לדעת מה
     כל אחד מהם סוגר. גרוע מזה: בחירת חדר צבעה גלולה ירוקה שנראית כמו
     ״נשמר״, בזמן שהשדה עצמו עוד לא עודכן והשורה למטה עדיין אמרה ״בלי
     מיקום״ — המסך סתר את עצמו.
     מעכשיו: נגיעה בחדר היא השמירה. אין ✓ על שדה. ✓ אחד בכרטיס, והוא
     זה שכותב לסדר היום. */
  const locLine=el('<p class="where"></p>');
  body.appendChild(locLine);
  const loc2Line=el('<p class="where2"></p>');
  body.appendChild(loc2Line);
  const paintLoc=()=>{
    locLine.innerHTML='';
    const sug=!it.loc&&it.sugLoc?it.sugLoc:'';
    const txt=it.loc?esc(it.loc):esc(sug);
    /* מיקום חסר הוא הדבר היחיד שמסומן באדום. אפשר לשמור בלעדיו, אבל
       בלי המיקום הליקוי לא מוצא את מקומו במסמך — ולכן הוא צועק. */
    const b=el(`<button class="tapedit ${it.loc?'':(sug?'ghosttxt':'needloc')}">${
      txt||'📍 חסר מיקום — נגיעה לבחירה'}${sug?' <span class="sugtag">מוצע</span>':''}</button>`);
    b.onclick=()=>editLoc();
    locLine.appendChild(b);
  };
  const editLoc=()=>{
    locLine.innerHTML='';
    const box=el('<div class="ed"></div>');
    box.appendChild(el('<p class="sughd">נגיעה בחדר שומרת אותו מיד</p>'));
    /* הגלולה בבוחר מראה רק מה שבאמת שמור — it.loc ולא הצעה. כך היא
       כבר לא מבטיחה שמירה שלא קרתה. */
    box.appendChild(locPicker(it.loc||'',async v=>{
      if(!v){ return; }
      it.loc=v; lastLoc=v; saveQueue();
      /* הבחירה סוגרת את הבוחר מעצמה: paintLoc מוחק את התיבה הזאת. */
      c.repaint(); if(it.k)await sync(it,c);
    }));
    const back=el('<button class="mini">✕ סגירה בלי שינוי</button>');
    back.onclick=()=>paintLoc();
    box.appendChild(el('<div class="okrow"></div>')).appendChild(back);
    locLine.appendChild(box);
  };
  /* ״איפה בדיוק בחדר״ יצא משדה בתוך עורך המיקום לשורה משל עצמו, מאותה
     סיבה: שדה שנפתח יחד עם בוחר החדרים גרר אחריו כפתור אישור משותף. */
  const paintLoc2=()=>{
    loc2Line.innerHTML='';
    if(!it.loc&&!it.sugLoc){ loc2Line.style.display='none'; return; }
    loc2Line.style.display='';
    const b=el(`<button class="tapedit ${it.loc2?'sublnk':'ghosttxt'}">${
      it.loc2?'📌 '+esc(it.loc2):'איפה בדיוק בחדר — נגיעה להוספה'}</button>`);
    b.onclick=()=>editLoc2();
    loc2Line.appendChild(b);
  };
  const editLoc2=()=>{
    loc2Line.innerHTML='';
    const f=el(`<div class="fld"><label>איפה בדיוק בחדר</label>
      <input placeholder="למשל: מתחת למזגן" autocomplete="off"></div>`);
    const i=f.querySelector('input'); i.value=it.loc2||'';
    i.addEventListener('input',()=>{ it.loc2=i.value; saveQueue(); });
    /* יציאה מהשדה היא השמירה. מצייר מחדש רק את השורה הזאת ולא את כל
       הכרטיס — אחרת נגיעה בכפתור אחר היתה מוחקת אותו לפני שהלחיצה
       מגיעה אליו, והנגיעה הראשונה היתה נבלעת. */
    i.addEventListener('blur',async()=>{ it.loc2=i.value.trim(); saveQueue();
      paintLoc2(); c.paintSt(); if(it.k&&!it.saving)await sync(it,c); });
    i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } });
    loc2Line.appendChild(f); i.focus();
  };

  /* השיוך לסעיף קיים — הקו המרכזי של המסך. ההצעה מוצגת ממולאת ומסומנת
     ״מוצע״, ונגיעה בה פותחת את כל האפשרויות. */
  const linkLine=el('<p class="lnk"></p>');
  body.appendChild(linkLine);
  const linkK=()=>it.link&&it.link!=='new'?it.link:null;
  const paintLink=()=>{
    linkLine.innerHTML='';
    /* תמיד כתוב במפורש לאן התמונה הולכת: לסעיף ששמו מופיע כאן, ליקוי חדש,
       או — כשעוד לא נבחר — הוראה לבחור. ״שיוך לסעיף קיים״ בלי שם הסעיף
       לא אמר איפה הצירוף ייפול. */
    if(it.tgt){
      const g=it.tgt, tt=esc(taskTitle(g.title));
      const what=g.newTask?`🆕 משימה חדשה: <b>${tt}</b><br>התמונה תהיה הסעיף הראשון שלה`
        :g.k==='new'?`➡️ <b>סעיף חדש</b> במשימה: ${tt}`
        :`➡️ יצורף לסעיף: ${esc(g.ktext||'')}<br>במשימה: ${tt}`;
      const b=el(`<button class="tapedit match"><span class="lnkhd">שיוך למשימה אחרת בלוח</span><br>${what}</button>`);
      b.onclick=()=>pickLink(); linkLine.appendChild(b); return;
    }
    if(it.link==='new'){
      const b=el('<button class="tapedit sublnk">🆕 יירשם כ<b>ליקוי חדש</b> · <u>לצרף במקום זה לסעיף קיים</u></button>');
      b.onclick=()=>pickLink(); linkLine.appendChild(b); return;
    }
    const k=linkK()||it.sugK;
    if(k&&itemByK(k)){
      const b=el(`<button class="tapedit match"><span class="lnkhd">יצורף לסעיף:</span><br>🔗 ${esc(shortOf(itemByK(k)))}${
        linkK()?'':' <span class="sugtag">מוצע</span>'}</button>`);
      b.onclick=()=>pickLink(); linkLine.appendChild(b); return;
    }
    const b=el('<button class="tapedit needloc">🔗 לאיזה סעיף לצרף? — נגיעה לבחירה (או ליקוי חדש)</button>');
    b.onclick=()=>pickLink(); linkLine.appendChild(b);
  };
  /* בוחר משימה אחרת: חיפוש/רשימה של כל המשימות הפתוחות, ואחרי הבחירה — הסעיפים
     שלה (רשימה נפתחת + חיפוש), או סעיף חדש בה. ובתחתית: משימה חדשה בשם
     שנכתב כאן, והתמונה היא הסעיף הראשון שלה. */
  const chooseTgt=g=>{
    it.tgt=g; it.link=null; saveQueue(); c.repaint();
    if(g.k==='new')editNote();
  };
  const pickTask=async()=>{
    linkLine.innerHTML='';
    const box=el('<div class="ed"></div>');
    box.appendChild(el('<p class="sughd">שיוך למשימה אחרת בלוח</p>'));
    const msg=el('<p class="lede">טוען את המשימות…</p>');
    box.appendChild(msg); linkLine.appendChild(box);
    const cancel=el('<button class="mini">✕ ביטול</button>');
    cancel.onclick=()=>pickLink();
    const all=await loadAllTasks();
    if(!all){
      msg.textContent='אין חיבור — נסו שוב';
      box.appendChild(el('<div class="okrow"></div>')).appendChild(cancel); return;
    }
    msg.remove();
    const norm=x=>String(x||'').toLowerCase();
    const showTasks=()=>{
      box.innerHTML='';
      box.appendChild(el('<p class="sughd">לאיזו משימה לשייך את התמונה?</p>'));
      const search=el('<div class="fld locsearch"><input placeholder="חיפוש משימה… (למשל: פרקט)" autocomplete="off"></div>');
      const inp=search.querySelector('input');
      const list=el('<div class="ddlist"></div>');
      const paint=()=>{
        list.innerHTML='';
        const q=norm(inp.value.trim());
        const rows=all.tasks.filter(t=>!t.done&&t.id!==TASK&&(!q||norm(t.title).indexOf(q)>=0))
          .sort((a,b)=>(itemsOfTask(b).length>0)-(itemsOfTask(a).length>0)||(a.order||0)-(b.order||0));
        if(!rows.length)list.appendChild(el('<div class="empty-state">אין משימה פתוחה שמכילה את זה</div>'));
        rows.slice(0,60).forEach(t=>{
          const n=itemsOfTask(t).filter(i=>!i.done).length;
          const r=el(`<button type="button" class="ddrow">${esc(taskTitle(t.title))}${
            n?` <span class="sugtag">${n} סעיפים</span>`:''}</button>`);
          r.onclick=()=>showSubs(t);
          list.appendChild(r);
        });
      };
      inp.addEventListener('input',paint);
      box.appendChild(search); box.appendChild(list);
      /* משימה חדשה */
      const nw=el(`<div class="fld locsearch combo"><input placeholder="או שם של משימה חדשה…" autocomplete="off">
        <button type="button" class="ddbtn">➕ משימה חדשה</button></div>`);
      const ni=nw.querySelector('input');
      nw.querySelector('button').onclick=()=>{
        const v=ni.value.trim();
        if(!v){ toast('כתבו קודם שם למשימה החדשה'); ni.focus(); return; }
        chooseTgt({newTask:true,title:v});
      };
      box.appendChild(nw);
      box.appendChild(el('<div class="okrow"></div>')).appendChild(cancel);
      paint();
    };
    const showSubs=t=>{
      box.innerHTML='';
      box.appendChild(el(`<p class="sughd">המשימה: ${esc(taskTitle(t.title))}</p>`));
      const search=el('<div class="fld locsearch"><input placeholder="חיפוש בסעיפים של המשימה…" autocomplete="off"></div>');
      const inp=search.querySelector('input');
      const list=el('<div class="ddlist"></div>');
      const paint=()=>{
        list.innerHTML='';
        const q=norm(inp.value.trim());
        const nb=el('<button type="button" class="ddrow xnew">➕ סעיף חדש במשימה הזאת (התמונה היא הסעיף)</button>');
        nb.onclick=()=>chooseTgt({task:t.id,title:t.title,k:'new'});
        list.appendChild(nb);
        itemsOfTask(t).filter(i=>!i.done&&(!q||norm(i.t).indexOf(q)>=0||norm(shortOf(i)).indexOf(q)>=0))
          .forEach(i=>{
            const r=el(`<button type="button" class="ddrow">${esc(shortOf(i))}</button>`);
            r.onclick=()=>chooseTgt({task:t.id,title:t.title,k:i.k,ktext:shortOf(i)});
            list.appendChild(r);
          });
      };
      inp.addEventListener('input',paint);
      box.appendChild(search); box.appendChild(list);
      const back=el('<button class="mini">← משימה אחרת</button>');
      back.onclick=()=>showTasks();
      const row=el('<div class="okrow"></div>'); row.appendChild(back); row.appendChild(cancel);
      box.appendChild(row);
      paint();
    };
    showTasks();
  };
  const pickLink=()=>{
    linkLine.innerHTML='';
    const box=el('<div class="ed"></div>');
    const chips=el('<div class="chips"></div>');
    /* כל הסעיפים הפתוחים בסדר היום: ▾ פותח את הרשימה המלאה, וכתיבה מסננת
       אותה. הסעיפים הקרובים למיקום של התמונה עולים למעלה ומסומנים ״קרוב״. */
    const search=el(`<div class="fld locsearch combo"><input placeholder="חיפוש בכל הסעיפים…" autocomplete="off">
      <button type="button" class="ddbtn" aria-expanded="false" aria-label="פתיחת רשימת כל הסעיפים">▾ כל הסעיפים</button></div>`);
    const inp=search.querySelector('input'), ddb=search.querySelector('.ddbtn');
    const dd=el('<div class="ddlist" hidden></div>');
    let ddOpen=false;
    const pickItem=async i=>{
      it.link=i.k; it.tgt=null;
      if(!it.loc&&it.sugLoc)it.loc=it.sugLoc;
      saveQueue(); c.repaint();
      if(it.k)await sync(it,c);
    };
    const paintDD=()=>{
      dd.innerHTML=''; dd.hidden=!ddOpen;
      ddb.setAttribute('aria-expanded',ddOpen?'true':'false');
      if(!ddOpen)return;
      const q=inp.value.trim();
      const near=new Set((it.sugList||[]).map(x=>x.k));
      const all=openItems().filter(i=>!q||i.t.indexOf(q)>=0||shortOf(i).indexOf(q)>=0)
        .sort((a,b)=>(near.has(b.k)?1:0)-(near.has(a.k)?1:0));
      if(!all.length){ dd.appendChild(el('<div class="empty-state">אין סעיף פתוח שמכיל את זה</div>')); return; }
      all.forEach(i=>{
        const r=el(`<button type="button" class="ddrow${it.link===i.k?' on':''}">${esc(shortOf(i))}${
          near.has(i.k)?' <span class="sugtag">קרוב</span>':''}</button>`);
        r.onclick=()=>pickItem(i);
        dd.appendChild(r);
      });
    };
    ddb.onclick=()=>{ ddOpen=!ddOpen; paintDD(); if(ddOpen)inp.focus(); };
    inp.addEventListener('keydown',e=>{ if(e.key==='Escape'){ ddOpen=false; paintDD(); } });
    const paintChips=()=>{
      chips.innerHTML='';
      /* ההצעות למיקום הזה. שאר הסעיפים — ברשימה הנפתחת למטה. */
      const list=it.sugList&&it.sugList.length?it.sugList
          :candidates(it.loc||it.sugLoc||'',it.note||'',null).map(x=>x.i);
      list.slice(0,4).forEach(i=>{
        const b=el(`<button type="button" class="${it.link===i.k?'on':''}">${esc(shortOf(i))}</button>`);
        /* בחירה היא בחירה, לא שמירה. שום דבר לא נכתב לסדר היום עד
           שרועי לוחץ ✓ — על הכרטיס או על ״אישור הכול״ למטה. */
        b.onclick=()=>pickItem(i);
        chips.appendChild(b);
      });
      if(!list.length)chips.appendChild(el('<div class="empty-state">אין סעיף קרוב למיקום הזה — פתחו את הרשימה או חפשו</div>'));
      const nb=el('<button type="button" class="new">➕ ליקוי חדש</button>');
      nb.onclick=()=>{ it.link='new'; it.tgt=null; saveQueue(); paintLink(); paintNote(); editNote(); };
      chips.appendChild(nb);
    };
    inp.addEventListener('input',()=>{ ddOpen=true; paintDD(); });
    box.appendChild(el('<p class="sughd">מה בסדר היום מתאים לתמונה הזאת</p>'));
    box.appendChild(chips); box.appendChild(search); box.appendChild(dd);
    /* תמונה שלא שייכת לסדר היום מול ברק בכלל (למשל הפרקט של יעקב). */
    if(!it.k){
      const other=el('<button type="button" class="mini xother">➡️ משימה אחרת בלוח — או משימה חדשה</button>');
      other.onclick=()=>pickTask();
      box.appendChild(other);
    }
    const no=el('<button class="mini">✕ ביטול</button>');
    no.onclick=()=>paintLink();
    box.appendChild(el('<div class="okrow"></div>')).appendChild(no);
    paintChips();
    linkLine.appendChild(box);
  };

  /* ההסבר — רק כשזה ליקוי חדש. כשהתמונה מצטרפת לסעיף קיים, הנוסח שלו
     הוא ההסבר, ושינוי שלו מכאן היה דורס מה שנכתב בלוח. */
  const noteLine=el('<p class="what"></p>');
  body.appendChild(noteLine);
  const paintNote=()=>{
    noteLine.innerHTML='';
    if(linkK()||(it.tgt&&!it.tgt.newTask&&it.tgt.k&&it.tgt.k!=='new')){ noteLine.style.display='none'; return; }
    noteLine.style.display='';
    const b=el(`<button class="tapedit ${it.note?'':'ghosttxt'}">${it.note?esc(it.note):'מה הליקוי — נגיעה לכתיבה'}</button>`);
    b.onclick=()=>editNote();
    noteLine.appendChild(b);
  };
  const editNote=()=>{
    noteLine.innerHTML='';
    const f=el(`<div class="fld"><textarea placeholder="מה רואים בתמונה ומה צריך לתקן"></textarea></div>`);
    const ta=f.querySelector('textarea'); ta.value=it.note||'';
    const take=()=>{
      it.note=ta.value;
      /* מי שטרח להקליד הסבר התכוון לליקוי חדש. בלי הקביעה הזאת
         ההצעה היתה גוברת על מה שהוא כתב, והטקסט שלו היה נעלם. */
      const was=it.link;
      if((it.note||'').trim()&&!linkK()&&!it.tgt)it.link='new';
      saveQueue(); if(was!==it.link)paintLink(); c.paintSt();
    };
    ta.addEventListener('input',take);
    /* כמו בשדה המיקום: היציאה מהשדה שומרת, בלי ✓ משלו. */
    ta.addEventListener('blur',async()=>{ ta.value=ta.value.trim(); take();
      paintNote(); if(it.k&&!it.saving)await sync(it,c); });
    noteLine.appendChild(f);
    ta.focus();
  };

  const st=el('<div class="st"></div>');
  body.appendChild(st);
  c.paintSt=()=>{
    st.innerHTML='';
    /* ״חסר מיקום או הסבר״ לא אומר מה חסר כאן ועכשיו. הודעה שאומרת
       בדיוק מה נשאר חוסכת ניחוש מול כל תמונה.
       המילה ״אישור״ לא מופיעה כאן יותר: הצ׳יפ מתאר מצב, והכפתור שלידו
       הוא הפעולה היחידה בכרטיס שכותבת לסדר היום — ולכן הוא אומר מה
       הוא עושה ולא ״מאשר״. */
    /* מה הכפתור עושה נקבע ב-plan(), אותו מקום שבו approveOne ו״אישור הכול״
       מחליטים מה לכתוב. קודם התווית נקבעה מ-sugK והפעולה מ-it.link — כשהמשתמש
       לחץ ״ליקוי חדש״ בלי להקליד הסבר, נשאר כפתור ״צירוף לסעיף״ שלחיצה עליו
       לא עשתה כלום. */
    const p=plan(it);
    const k=linkK();
    const ready=!!p;
    if(it.k){
      st.appendChild(el(`<span class="pill ok">✓ ${it.moved?'הועברה למשימה: '+esc(taskTitle(it.moved.title)):(k?'צורפה לסעיף':'בסדר היום')}</span>`));
      /* נשמר, וזה עדיין לא שלם. בלי התזכורת הזאת ״✓״ נראה כמו סוף הסיפור
         והליקוי היה נשאר לנצח בלי מקום. */
      if(!it.loc&&!it.moved)st.appendChild(el('<span class="pill hot">עדיין חסר מיקום</span>'));
    }
    else if(it.saving)st.appendChild(el('<span class="pill">שומר…</span>'));
    else if(!ready)st.appendChild(el(`<span class="pill hot">${
      it.tgt?(it.tgt.newTask?'חסר שם למשימה החדשה':(it.tgt.k==='new'?'חסר הסבר לסעיף החדש':'בחרו סעיף במשימה'))
      :it.link==='new'?'חסר הסבר לליקוי החדש':'חסר שיוך — בחרו סעיף או ליקוי חדש'}</span>`));
    else if(p==='attach'&&!k)st.appendChild(el(`<span class="pill sug">הצעה — עוד לא נשמר${
      it.loc||it.sugLoc?'':' · בלי מיקום'}</span>`));
    else st.appendChild(el(`<span class="pill">עוד לא נשמר${
      it.loc||it.sugLoc?'':' · בלי מיקום'}</span>`));
    /* כתיבה של תמונה אחת לסדר היום. ״אישור הכול״ למטה עושה את זה לכולן.
       mousedown לא מעביר את הפוקוס מהשדה הפתוח: בלי זה ה-blur של השדה צייר
       מחדש את שורת המצב והכפתור הוחלף לפני שהלחיצה הגיעה אליו — והיו צריכים
       ללחוץ פעמיים. הטקסט כבר נשמר ב-input, לכן אין מה לחכות ל-blur. */
    const keepFocus=b=>b.addEventListener('mousedown',e=>e.preventDefault());
    if(!it.k&&ready){
      const ok=el(`<button class="mini go2">${
        ({attach:'צירוף לסעיף ←',xattach:'צירוף לסעיף במשימה האחרת ←',xnew:'הוספה כסעיף חדש במשימה ←',
          xtask:'פתיחת משימה חדשה ←'})[p]||'הוספה כליקוי חדש ←'}</button>`);
      keepFocus(ok);
      ok.onclick=async()=>{ if(it.saving)return; ok.disabled=true; ok.textContent='שומר…'; await approveOne(it,c); };
      st.appendChild(ok);
    }
    const rm=el('<button class="mini">הסרה</button>');
    keepFocus(rm);
    rm.onclick=()=>removeOne(QUEUE.indexOf(it));
    st.appendChild(rm);
  };

  c.repaint=()=>{ paintLoc(); paintLoc2(); paintLink(); paintNote(); c.paintSt(); };
  c.repaint();
  return c;
}

/* ===== המסך המרכזי: כל התמונות יחד, כמו במסמך =====
   קודם זה היה אשף של תמונה-אחרי-תמונה. הוא הסתיר את מה שהכי חשוב לדעת
   אחרי העלאה — אילו תמונות בכלל עלו — והציג ״עוד 1 אחריה״ שלא אומר כלום
   ולא ניתן ללחיצה. כאן רואים את הכול בבת אחת, בצורה של המסמך הסופי,
   ועורכים כל שדה בנגיעה בטקסט עצמו. */
function renderReview(app){
  $('#h1').textContent='התמונות שהעליתי';
  const done=QUEUE.filter(x=>x.k).length;
  $('#lede').innerHTML=`${QUEUE.length} תמונות · <b>${done}</b> כבר בסדר היום`;
  app.classList.add('doc');

  app.appendChild(tabsEl('shots'));

  /* כשלים נשארים על המסך ולא נעלמים כמו טוסט. בטלפון, טוסט של תשע
     שניות פירושו שפורמט שלם יכול להיכשל בלי שאיש ישים לב. */
  if(FAILED.length){
    const w=el(`<div class="fails"><p class="hd">${FAILED.length} קבצים לא עלו</p></div>`);
    FAILED.forEach(b=>w.appendChild(el(`<p class="ln">${esc(b.n)} — ${esc(b.w)}</p>`)));
    const x=el('<button class="mini">הבנתי, להסיר את ההודעה</button>');
    x.onclick=()=>{ FAILED=[]; render(); };
    w.appendChild(x);
    app.appendChild(w);
  }

  if(!QUEUE.length){
    app.appendChild(el('<div class="empty-state">אין תמונות שממתינות לפרטים.</div>'));
  }

  /* ההסבר שלמעלה הוא מה שהופך את ״מוצע״ למובן. בלעדיו נראה שהדף החליט
     משהו בשם רועי, ולא שהוא מציע לו. */
  const pend=QUEUE.filter(x=>!x.k);
  const matched=pend.filter(x=>plan(x)==='attach').length;
  if(pend.length)app.appendChild(el(`<p class="lede noprint">לכל תמונה מוצע המיקום
    של התמונה שלפניה והסעיף שמתאים לה בסדר היום. ${matched?`<b>${matched}</b> מתוך
    ${pend.length} קיבלו הצעה.`:''} עברו עליהן, תקנו מה שלא מתאים, ואשרו למטה.</p>`));

  /* אחרי חצי סיור חצי מהרשימה כבר מאושרת, והיא דוחפת למטה את מה
     שעוד צריך טיפול. ברירת המחדל היא להראות הכול — ככה רואים את
     המסמך המצטבר — אבל אפשר לקפל את מה שנסגר. */
  const okd=QUEUE.filter(x=>x.k);
  if(okd.length){
    const t=el(`<button class="mini noprint" style="margin:4px 0 2px">${
      HIDEOK?`הצגת ${okd.length} שאושרו`:`הסתרת ${okd.length} שאושרו`}</button>`);
    t.onclick=()=>{ HIDEOK=!HIDEOK; render(); };
    app.appendChild(t);
  }
  QUEUE.forEach((it,i)=>{ if(HIDEOK&&it.k)return; app.appendChild(shotCard(it,i+1)); });

  /* הכפתור סופר רק את מה שבאמת ניתן לאישור. ״אישור כל 19״ שישמור
     ארבע הוא הבטחה שלא מתקיימת. */
  const can=pend.filter(x=>plan(x)).length;
  if(can){
    const all=el(`<button class="go noprint">✓ אישור ${
      can===1?(pend.length===1?'התמונה':'התמונה המוכנה')
      :can===pend.length?`כל ${can} התמונות`:`${can} התמונות המוכנות`}</button>`);
    all.onclick=()=>approveAll(all);
    app.appendChild(all);
  }

  /* ״עוד תמונות״ היה כפתור שקרא ל-clearQueue, כלומר מחק את התור ואת
     הזיכרון המקומי שלו. רועי העלה 12 תמונות, ראה אותן, לחץ עליו —
     והן נעלמו מהמסך בלי דרך חזרה, בזמן שהקבצים עצמם נשארו במסד בלי
     שיוך. כאן זה הבוחר עצמו, והאצווה החדשה מצטרפת לקיימת. */
  app.appendChild(mkDrop(()=>render()));
  app.appendChild(el(`<a class="go ghost noprint" style="text-align:center;text-decoration:none" href="?v=doc">📄 המסמך</a>`));
  app.appendChild(el(`<a class="go ghost noprint" style="text-align:center;text-decoration:none" href="./">↩ חזרה לסדר היום מול ברק</a>`));
}

/* נשאר רק במקום אחד: עריכה שכותבת ישירות לסדר היום. בכרטיס תמונה אין
   אישור על שדה — נגיעה היא השמירה — כדי שלא יהיו שני כפתורי ״אישור״
   על אותו מסך, ברמות שונות, בלי שום דבר שמסביר במה הם נבדלים. */
function okCancel(onOk,onCancel,label){
  const r=el('<div class="okrow"></div>');
  const ok=el(`<button class="mini go2">✓ ${esc(label||'שמירה')}</button>`);
  const no=el('<button class="mini">✕ ביטול</button>');
  ok.onclick=async()=>{ ok.disabled=true; ok.textContent='שומר…'; await onOk(); };
  no.onclick=onCancel;
  r.appendChild(ok); r.appendChild(no);
  return r;
}

function removeOne(i){
  /* רק מהתור. הקובץ עצמו נשאר במסד — מחיקה שם היא פעולה הרסנית
     שאסור לתלות בנגיעה אחת על מסך קטן. */
  QUEUE.splice(i,1); saveQueue(); render();
}

const shortOf=i=>{ const s=noteOf(i).replace(/\s+/g,' ').trim();
  return s.length>52?s.slice(0,50)+'…':s; };
function paintLede(){
  if(VIEW!=='')return;
  const d=QUEUE.filter(x=>x.k).length;
  $('#lede').innerHTML=`${QUEUE.length} תמונות · <b>${d}</b> כבר בסדר היום`;
}

/* שתי דרכים שתמונה נכנסת לסדר היום, ושתיהן נשמרות מעצמן:
   צירוף לסעיף קיים (הרוב, בסיור מול ברק), או ליקוי חדש. */
async function sync(it,card){
  /* תמונה שהועברה למשימה אחרת כבר נכתבה שם; עריכה כאן לא נוגעת בה. */
  if(it.moved||it.tgt)return;
  const k=it.link&&it.link!=='new'?it.link:null;
  /* מיקום אינו תנאי לשמירה — ראה commitOne. התנאי היחיד הוא שיהיה ברור
     לאיזה ליקוי התמונה שייכת: סעיף קיים, או הסבר שרועי כתב. */
  if(!k&&!(it.note||'').trim()){
    card.repaint?card.repaint():card.paintSt&&card.paintSt(); return;
  }
  it.okd=1;
  it.saving=true; card.paintSt&&card.paintSt();
  const ok=k?await attachOne(it):await commitOne(it);
  it.saving=false;
  if(!ok)toast('השמירה נכשלה — אין חיבור. הפרטים נשמרו במכשיר, נסו שוב');
  saveQueue();
  card.repaint?card.repaint():card.paintSt&&card.paintSt();
  paintLede();
}

/* צירוף לסעיף קיים. הנוסח של הסעיף לא נוגעים בו — הוא נכתב בלוח לפני
   הסיור, לפעמים בידי יעל, ומה שהתמונה מוסיפה הוא תמונה ומיקום. */
async function attachOne(it){
  const live=itemByK(it.link);
  if(!live){ toast('הסעיף לא נמצא בסדר היום — נסו לרענן'); return false; }
  const meta={fid:it.fid,task:TASK+'__'+it.link,name:it.name||noteOf(live),
    type:it.type,size:it.size,at:new Date().toISOString(),by:'roi'};
  const a=await put(`${FMETA}/${encodeURIComponent(TASK+'__'+it.link)}/${it.fid}.json`,meta);
  /* תמונה שנייה לאותו סעיף נרשמת במטא (והלוח יראה את שתיהן), אבל fid
     של הפריט נשאר הראשון — המסמך מציג תמונה אחת לשורה. */
  const patch={fid:live.fid||it.fid};
  /* מיקום שרועי בחר גובר על מה שרשום בסעיף: הוא עומד עכשיו במקום
     ורואה אותו, וזו הסיבה היחידה שהוא טרח לבחור. */
  if(it.loc){ patch.loc=it.loc; patch.loc2=it.loc2||''; }
  const b=await upsertItem(Object.assign({},live,patch));
  if(a&&b)it.k=it.link;
  return a&&b;
}

/* מה ייכתב לסדר היום בשביל התמונה הזאת: 'attach' (צירוף לסעיף קיים — או
   המוצע, או שנבחר), 'new' (ליקוי חדש, רק עם הסבר) או null (עוד חסר משהו).
   הכפתור, הצ׳יפ, מונה ״אישור הכול״ ושתי פעולות האישור כולן קוראות לזה, כדי
   שמה שכתוב על הכפתור הוא בדיוק מה שהוא עושה. */
function plan(it){
  const note=(it.note||'').trim();
  /* שיוך למשימה אחרת בלוח (it.tgt): xattach = לסעיף קיים שלה, xnew = סעיף
     חדש בה, xtask = משימה חדשה שהתמונה היא הסעיף הראשון שלה. */
  if(it.tgt){
    const g=it.tgt;
    if(g.newTask)return (g.title||'').trim()?'xtask':null;
    if(!g.task)return null;
    if(g.k==='new')return note?'xnew':null;
    return g.k?'xattach':null;
  }
  if(it.link==='new')return note?'new':null;
  const k=it.link||it.sugK;
  if(k&&itemByK(k))return 'attach';
  return note?'new':null;
}

/* ===== שיוך למשימה אחרת =====
   התמונה היא קובץ במסד ואין לה בעלים עד שנרשם לה מטא תחת <משימה>__<סעיף>.
   ״העברה״ היא בדיוק זה: לכתוב את המטא תחת המשימה האחרת ולהוסיף לה סעיף
   (או להשלים לסעיף קיים את ה-fid). הקובץ עצמו לא זז ושום דבר לא נמחק;
   ואחרי שהמטא נכתבה התמונה כבר לא נחשבת יתומה, ולכן לא תחזור למסך. */
let ALLT=null;
async function loadAllTasks(force){
  if(ALLT&&!force)return ALLT;
  const j=await getJSON(DB+'/board/tasks.json');
  if(!j||typeof j!=='object')return null;
  const tasks=(Array.isArray(j)?j:Object.values(j)).filter(t=>t&&t.id&&t.title);
  let maxOrder=0;
  tasks.forEach(t=>{ if(typeof t.order==='number'&&t.order>maxOrder)maxOrder=t.order; });
  ALLT={tasks,maxOrder};
  return ALLT;
}
const itemsOfTask=t=>{
  const v=t&&t.items;
  const a=Array.isArray(v)?v:(v&&typeof v==='object'?Object.keys(v).sort((x,y)=>x-y).map(k=>v[k]):[]);
  return a.filter(i=>i&&i.t);
};
const taskTitle=t=>String(t||'').replace(/\s+/g,' ').trim();
async function moveOne(it){
  const g=it.tgt, note=(it.note||'').trim();
  const mk=()=>'lk'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const text=()=>note?`${it.loc?`📍 ${it.loc} · `:''}**${note}**${it.loc2?` *(${it.loc2})*`:''}`
    :`📸 ${taskTitle(g.title)}`;
  const metaFor=(tid,k)=>({fid:it.fid,task:tid+'__'+k,name:it.name||note||g.ktext||taskTitle(g.title),
    type:it.type,size:it.size,at:new Date().toISOString(),by:'roi'});
  const putMeta=(tid,k)=>put(`${FMETA}/${encodeURIComponent(tid+'__'+k)}/${it.fid}.json`,metaFor(tid,k));
  let tid=g.task, k=g.k, ok=false;
  if(g.newTask){
    const all=await loadAllTasks(true);
    if(!all){ toast('אין חיבור — נסו שוב'); return false; }
    tid='t'+Date.now()+Math.floor(Math.random()*99);
    k=mk();
    const item={k,lv:1,done:false,ans:'',t:text(),fid:it.fid,loc:it.loc||'',loc2:it.loc2||'',at:Date.now(),by:'roi'};
    /* אותה צורה שהלוח עצמו יוצר (addTask), כולל order בסוף הרשימה. */
    const t={id:tid,title:taskTitle(g.title),notes:'',cat:'reno',due:null,list:'now',
      order:all.maxOrder+10,done:false,owner:'שנינו',ongoing:true,items:[item],updatedAt:Date.now()};
    const a=await putMeta(tid,k);
    const b=a&&await put(`${DB}/board/tasks/${encodeURIComponent(tid)}.json`,t);
    ok=!!(a&&b);
    if(ok)ALLT=null;
  } else if(k==='new'){
    k=mk();
    const item={k,lv:1,done:false,ans:'',t:text(),fid:it.fid,loc:it.loc||'',loc2:it.loc2||'',at:Date.now(),by:'roi'};
    const a=await putMeta(tid,k);
    const b=a&&await upsertItem(item,tid,true);
    ok=!!(a&&b);
    if(ok)ALLT=null;
  } else {
    /* סעיף קיים במשימה אחרת: הנוסח שלו לא נוגעים בו. fid נוסף רק אם אין לו עוד. */
    const live=await getJSON(`${DB}/board/tasks/${encodeURIComponent(tid)}/items.json`);
    const arr=Array.isArray(live)?live:(live&&typeof live==='object'?Object.values(live):[]);
    const cur=arr.find(x=>x&&x.k===k);
    if(!cur){ toast('הסעיף לא נמצא במשימה — נסו לרענן'); return false; }
    const a=await putMeta(tid,k);
    const b=a&&await upsertItem(Object.assign({},cur,{fid:cur.fid||it.fid}),tid,true);
    ok=!!(a&&b);
    if(ok)ALLT=null;
  }
  if(ok){ it.k='moved'; it.moved={task:tid,title:taskTitle(g.title),k}; }
  return ok;
}
async function doMove(it,card){
  it.saving=true; card.paintSt&&card.paintSt();
  const ok=await moveOne(it);
  it.saving=false;
  if(!ok)toast('ההעברה נכשלה — אין חיבור. הפרטים נשמרו במכשיר, נסו שוב');
  else toast('התמונה הועברה ל: '+taskTitle(it.moved.title),3000);
  saveQueue();
  card.repaint?card.repaint():card.paintSt&&card.paintSt();
  paintLede();
}

/* אישור של תמונה אחת: מה שמוצע נהפך למה שנשמר. */
async function approveOne(it,card){
  if(!it.loc&&it.sugLoc)it.loc=it.sugLoc;
  if((plan(it)||'')[0]==='x'){ saveQueue(); await doMove(it,card); return; }
  if(plan(it)==='attach'&&!it.link)it.link=it.sugK;
  if(it.loc)lastLoc=it.loc;
  saveQueue();
  await sync(it,card);
}

/* ===== אישור הכול =====
   זה הצד השני של ההתאמה: הדף מציע מיקום וסעיף לכל תמונה, רועי עובר על
   כולן, מתקן את מה שלא מתאים — ואז מאשר הכול בלחיצה אחת. מה שלא ניתן
   לאישור (אין שיוך ואין הסבר) נשאר על המסך ונאמר בכמה. */
async function approveAll(btn){
  const pend=QUEUE.filter(x=>!x.k);
  if(!pend.length)return;
  btn.disabled=true;
  let done=0,left=0;
  for(let n=0;n<pend.length;n++){
    const it=pend[n];
    btn.textContent=`שומר ${n+1} מתוך ${pend.length}…`;
    if(!it.loc&&it.sugLoc)it.loc=it.sugLoc;
    const p=plan(it);
    if(p==='attach'&&!it.link)it.link=it.sugK;
    if(p)it.okd=1;
    if(p&&p[0]==='x'){ if(await moveOne(it))done++; else left++; }
    else if(p==='attach'){ if(await attachOne(it))done++; else left++; }
    else if(p==='new'){ if(await commitOne(it))done++; else left++; }
    else left++;
    saveQueue();
  }
  render();
  toast(done?`${done} תמונות נכנסו לסדר היום${left?`\n${left} עוד מחכות לפרטים`:''}`
    :'לא נשמר כלום — לתמונות שנשארו חסר שיוך או הסבר',4500);
}

/* ליקוי אחד → פריט ב-items + מטא-דאטה שמקשרת אליו את התמונה.
   המטא נכתבת תחת <task>__<k> כי זה המפתח שהלוח כבר מחפש לפי נושא,
   ולכן הנושא מקבל 📎 והתמונה נפתחת בלוח בלי שינוי בקוד שלו. */
async function commitOne(it){
  const isNew=!it.k;
  const k=it.k||('lk'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
  const where=it.loc2?`${it.loc} · ${it.loc2}`:it.loc;
  /* מיקום הוא נדרש אבל לא חוסם: ליקוי בלי מיקום נכנס לסדר היום כמו כל
     אחד אחר, רק בלי השורה של המקום — והוא נשאר ברשימת ״חסרים״ עד
     שמשלימים אותו. עדיף סעיף בלי מיקום מאשר ליקוי שלא נרשם כי רועי
     לא זכר באמצע הסיור איך קוראים לחדר. */
  const item={k,lv:1,done:false,ans:'',
    t:`${it.loc?`📍 ${it.loc} · `:''}**${(it.note||'').trim()}**${it.loc2?` *(${it.loc2})*`:''}`,
    fid:it.fid,loc:it.loc,loc2:it.loc2||'',at:it.at||Date.now(),by:'roi'};
  const meta={fid:it.fid,task:TASK+'__'+k,name:it.name||where,type:it.type,size:it.size,
    at:new Date().toISOString(),by:'roi'};
  const a=await put(`${FMETA}/${encodeURIComponent(TASK+'__'+k)}/${it.fid}.json`,meta);
  const b=await upsertItem(item);
  if(a&&b){ it.k=k; it.at=item.at; }
  else if(isNew)it.k=null;
  return a&&b;
}

/* ===== מסך הפתיחה ===== */
function renderStart(app){
  $('#h1').textContent='ליקויים';
  $('#lede').innerHTML='הבית שלנו · הליקויים נכנסים ל<b>סדר היום מול ברק</b>';
  app.appendChild(tabsEl('shots'));
  const open=(TASKOBJ&&(TASKOBJ.items||[]).filter(i=>i&&i.fid&&!i.done).length)||0;
  const all=(TASKOBJ&&(TASKOBJ.items||[]).filter(i=>i&&i.fid).length)||0;
  app.appendChild(el(`<p class="lede"><span class="pill ${open?'hot':'ok'}">${open} ליקויים פתוחים</span>
    <span class="pill">${all} סה״כ</span></p>`));
  app.appendChild(mkDrop(()=>render()));
  app.appendChild(el(`<p class="lede">צלם כמה שצריך בבת אחת. אחר כך רואים את כולן יחד,
    ובנגיעה בטקסט שליד כל תמונה ממלאים מיקום והסבר. המיקום נבחר בנקישה.</p>`));
  /* עצה ולא מגבלה: הטלפון מפענח כל תמונה בנפרד, ואצווה ענקית מעמיסה
     עליו. מי שבכל זאת יבחר שבעים — זה יעבוד, רק לאט יותר. */
  /* לא עצה ולא קוסמטיקה: בבחירה של 106 תמונות אייפון לא מסר לדף אף
     קובץ — הלחיצה על ✓ בגלריה פשוט לא הגיעה לכאן. 10–15 בכל פעם עובד,
     וההמשך מצטרף לאותה רשימה. */
  app.appendChild(el(`<p class="lede" style="opacity:.8"><b>10–15 תמונות בכל פעם.</b>
    בבחירה גדולה מזה הטלפון עלול לא להעביר כלום, ואז נראה שלא קרה דבר.
    אפשר לחזור ולהוסיף עוד כמה פעמים שצריך — הכול מצטבר לאותה רשימה,
    וגם אם הדף נסגר הוא חוזר למקום.</p>`));
}

/* ===== מה חסר כדי שהמסמך יהיה שלם =====
   שני סוגי חוסר, ולכל אחד הפעולה שסוגרת אותו במקום: תמונה שהועלתה וחסרים
   לה מיקום והסבר נערכת כאן באותו כרטיס בדיוק כמו במסך התמונות, וסעיף
   פתוח בסדר היום שאין לו תמונה מקבל כפתור שמצרף לו אחת. */
function renderGaps(app){
  $('#h1').textContent='מה חסר';
  app.classList.add('doc');
  app.appendChild(tabsEl('gaps'));

  const shots=gapShots(), items=gapItems(), noloc=gapLoc();
  $('#lede').innerHTML=`<b>${shots.length}</b> תמונות בלי פרטים · <b>${noloc.length}</b> ליקויים
    בלי מיקום · <b>${items.length}</b> סעיפים בלי תמונה`;

  if(noloc.length){
    app.appendChild(el('<h2>ליקויים שנשמרו בלי מיקום</h2>'));
    app.appendChild(el(`<p class="lede noprint">אלה כבר בסדר היום, עם תמונה.
      בלי מיקום הם מופיעים במסמך תחת ״בלי מיקום״ ואי אפשר למצוא אותם בבית.</p>`));
    noloc.forEach(i=>app.appendChild(locFixRow(i)));
  }

  if(!shots.length&&!items.length&&!noloc.length){
    app.appendChild(el('<div class="empty-state">אין חוסרים. כל התמונות מתויקות וכל סעיף פתוח מצולם.</div>'));
    app.appendChild(el(`<a class="go ghost noprint" style="text-align:center;text-decoration:none" href="?v=doc">📄 המסמך</a>`));
    return;
  }

  if(shots.length){
    app.appendChild(el('<h2>תמונות שחסרים להן מיקום או הסבר</h2>'));
    shots.forEach((it,i)=>app.appendChild(shotCard(it,i+1)));
  }

  if(items.length){
    app.appendChild(el('<h2>סעיפים פתוחים בלי תמונה</h2>'));
    app.appendChild(el(`<p class="lede noprint">אלה סעיפים שכבר רשומים בסדר היום מול ברק.
      תמונה שמצורפת לסעיף מופיעה גם בלוח וגם במסמך.</p>`));
    items.forEach(it=>app.appendChild(gapItemRow(it)));
  }

  /* תמונות שעלו מזמן ואין להן פרטים. הן לא נכנסות לבד למסך — אחרי
     שבועיים זו כנראה שארית ולא עבודה באמצע — אבל אסור שהן ייעלמו
     בשקט, כי הקבצים עצמם יושבים במסד. */
  if(OLDER){
    const w=el(`<div class="gaprow"><p class="txt">יש עוד <b>${OLDER}</b> תמונות
      שהועלו לפני יותר משבוע ואין להן מיקום, הסבר או סעיף.</p></div>`);
    const b=el('<button class="mini">להציג גם אותן</button>');
    b.onclick=async()=>{ b.disabled=true; b.textContent='טוען…';
      const o=await adoptOrphans(3650); OLDER=0;
      if(o.added){ location.href='?'; } else { b.textContent='לא נמצאו'; } };
    w.appendChild(b);
    app.appendChild(w);
  }

  app.appendChild(el(`<a class="go ghost noprint" style="text-align:center;text-decoration:none" href="?v=doc">📄 המסמך</a>`));
  app.appendChild(el(`<a class="go ghost noprint" style="text-align:center;text-decoration:none" href="./">↩ חזרה לסדר היום מול ברק</a>`));
}

/* השלמת מיקום לליקוי שכבר בסדר היום. נוגעים רק בשדות המיקום — הנוסח
   של הסעיף נשאר, גם כשהוא נכתב בלוח ולא כאן. */
function locFixRow(it){
  const row=el(`<div class="gaprow"><p class="txt">${esc(noteOf(it))}</p></div>`);
  const ph=el('<div class="miniph"></div>');
  const im=el('<img alt="" loading="lazy">'); ph.appendChild(im); fillThumb(im,it.fid);
  row.insertBefore(ph,row.firstChild);
  const line=el('<div></div>');
  const paint=()=>{
    line.innerHTML='';
    const b=el('<button class="tapedit needloc">📍 חסר מיקום — נגיעה לבחירה</button>');
    b.onclick=()=>edit();
    line.appendChild(b);
  };
  const edit=()=>{
    line.innerHTML='';
    const box=el('<div class="ed"></div>');
    /* כאן, בשונה מכרטיס תמונה, הכפתור באמת כותב לסדר היום — הליקוי כבר
       שמור שם וזו עריכה שלו. לכן נשאר כפתור אחד, והוא אומר מה הוא עושה.
       הבוחר מתחיל ריק ולא על lastLoc, כדי שגלולה ירוקה לא תבטיח חדר
       שאיש לא בחר. */
    let nl='', nl2='';
    box.appendChild(locPicker('',v=>{ nl=v; }));
    const f2=el(`<div class="fld"><label>איפה בדיוק בחדר</label>
      <input placeholder="למשל: מתחת למזגן" autocomplete="off"></div>`);
    f2.querySelector('input').addEventListener('input',e=>{ nl2=e.target.value; });
    box.appendChild(f2);
    box.appendChild(okCancel(async()=>{
      if(!nl){ paint(); return; }
      const patch={loc:nl,loc2:nl2};
      /* רק סעיף שנוצר כאן בלי מיקום מקבל את השורה ״📍 מקום ·״. לסעיף
         שנכתב בלוח יש כבר כותרת אזור משלו, ודריסה שלה היתה מוחקת אותה. */
      if(/^\*\*/.test(it.t||''))patch.t=`📍 ${nl} · ${it.t}`;
      const ok=await upsertItem(Object.assign({},it,patch));
      if(ok){ lastLoc=nl; toast('המיקום נשמר ✓'); render(); }
      else { toast('השמירה נכשלה — נסו שוב'); paint(); }
    },()=>paint(),'שמירת המיקום'));
    line.appendChild(box);
  };
  paint(); row.appendChild(line);
  return row;
}

function gapItemRow(it){
  const row=el(`<div class="gaprow"><p class="txt">${esc(noteOf(it))}</p></div>`);
  const bar=el('<div class="bar"><i></i></div>'); bar.style.display='none';
  const lab=el(`<label class="addph">➕ תמונה לסעיף הזה
    <input type="file" accept="image/*,.heic,.heif"></label>`);
  const inp=lab.querySelector('input');
  inp.onchange=async e=>{
    const fs=[...e.target.files]; e.target.value='';
    if(!fs.length)return;
    lab.style.display='none'; bar.style.display='block';
    let got=null;
    const res=await addFiles(fs.slice(0,1),()=>{},one=>{ got=one; });
    bar.style.display='none';
    if(!got){
      lab.style.display='';
      const why=(res.bad[0]&&res.bad[0].w)||'ההעלאה נכשלה';
      row.appendChild(el(`<p class="ln">${esc(why)}</p>`));
      return;
    }
    /* הסעיף כבר קיים בלוח עם ה-k שלו, ולכן זו הצמדה ולא יצירה: המטא
       נכתבת תחת אותו k, והפריט מתעדכן במקום. */
    const meta={fid:got.fid,task:TASK+'__'+it.k,name:got.name||noteOf(it),type:got.type,
      size:got.size,at:new Date().toISOString(),by:'roi'};
    const a=await put(`${FMETA}/${encodeURIComponent(TASK+'__'+it.k)}/${got.fid}.json`,meta);
    const b=await upsertItem(Object.assign({},it,{fid:got.fid}));
    if(a&&b){ it.fid=got.fid; toast('התמונה צורפה לסעיף ✓'); render(); }
    else { lab.style.display=''; toast('הצירוף נכשל — נסו שוב'); }
  };
  row.appendChild(bar); row.appendChild(lab);
  return row;
}

/* ===== המסמך =====
   מחולק לפי אזור ואז לפי חדר, כך שאפשר לעבור איתו בבית מלמטה למעלה. */
function zoneOf(loc){
  if(/^קומה עליונה/.test(loc))return 'קומה עליונה';
  if(/^קומה תחתונה/.test(loc))return 'קומה תחתונה';
  if(/^חצר|^צד |^חנייה/.test(loc))return 'חוץ וחצר';
  return 'כללי';
}
const ZORD=['קומה תחתונה','קומה עליונה','חוץ וחצר','כללי'];
function roomOf(loc){
  return String(loc||'').replace(/^(קומה עליונה|קומה תחתונה|חצר)\s*[-–]\s*/,'').trim()||loc||'בלי מיקום';
}
function defects(){
  return ((TASKOBJ&&TASKOBJ.items)||[]).filter(i=>i&&i.fid);
}
function grouped(withDone){
  const list=defects().filter(i=>withDone||!i.done);
  const zones={};
  list.forEach(i=>{
    const z=zoneOf(i.loc||''), r=roomOf(i.loc||'');
    (zones[z]=zones[z]||{})[r]=(zones[z][r]||[]).concat([i]);
  });
  return ZORD.filter(z=>zones[z]).map(z=>({zone:z,
    rooms:Object.keys(zones[z]).map(r=>({room:r,rows:zones[z][r]}))}));
}
/* רק הממוזערות נטענות לתצוגה. המלאות נטענות רק לפני הדפסה. */
async function fillThumb(img,fid){
  const j=await getJSON(FTHUMB+'/'+fid+'.json');
  const d=j&&(j.data||j);
  if(typeof d==='string'){ img.src=d; img.dataset.thumb='1'; }
  else { const f=await getJSON(FDATA+'/'+fid+'.json'); const fd=f&&(f.data||f);
    if(typeof fd==='string')img.src=fd; }
  img.onclick=async()=>{ const f=await getJSON(FDATA+'/'+fid+'.json'); const fd=f&&(f.data||f);
    if(typeof fd==='string'){ $('#lbimg').src=fd; $('#lb').classList.add('on'); } };
}
function renderDoc(app){
  $('#h1').textContent='רשימת ליקויים';
  const today=new Date().toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
  $('#lede').innerHTML=`הבית שלנו · ${today}`;
  app.classList.add('doc');
  app.appendChild(tabsEl('doc'));

  const secs=grouped(false);
  const n=secs.reduce((a,z)=>a+z.rooms.reduce((b,r)=>b+r.rows.length,0),0);
  app.appendChild(el(`<p class="lede noprint"><span class="pill hot">${n} ליקויים לטיפול</span></p>`));
  if(!n){ app.appendChild(el('<div class="empty-state">אין ליקויים פתוחים ברשימה.</div>')); return; }

  let num=0;
  secs.forEach(z=>{
    app.appendChild(el(`<h2>${esc(z.zone)}</h2>`));
    z.rooms.forEach(r=>{
      app.appendChild(el(`<h3>${esc(r.room)}</h3>`));
      r.rows.forEach(it=>{
        num++;
        const c=el(`<div class="lk"><span class="n">${num}</span>
          <div class="ph"></div><div class="body"></div></div>`);
        const ph=c.querySelector('.ph'), body=c.querySelector('.body');
        const im=el('<img alt="" loading="lazy">'); ph.appendChild(im); fillThumb(im,it.fid);
        im.dataset.fid=it.fid;
        /* הכותרת שמעל כבר אומרת באיזה חדר אנחנו, ולכן כאן רק המיקום
           המדויק. חזרה על שם החדר בכל שורה מרעישה מסמך מודפס. */
        if(it.loc2)body.appendChild(el(`<p class="where"><span>${esc(it.loc2)}</span></p>`));
        body.appendChild(el(`<p class="what">${esc(noteOf(it))}</p>`));
        app.appendChild(c);
      });
    });
  });

  const pr=el('<button class="go noprint">🖨 הדפסה או שמירה כ-PDF</button>');
  pr.onclick=()=>printFull(app,pr);
  app.appendChild(pr);
  const gd=el('<button class="go ghost noprint">📝 העתקה להדבקה בגוגל דוקס</button>');
  gd.onclick=copyRich;
  app.appendChild(gd);
  const wa=el('<button class="go ghost noprint">💬 וואטסאפ</button>');
  wa.onclick=async()=>{ const t=waText();
    try{ await navigator.clipboard.writeText(t); }catch(e){}
    if(t.length<1500)window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
    else toast('הרשימה ארוכה — הועתקה, אפשר להדביק'); };
  app.appendChild(wa);
  app.appendChild(el(`<div class="note noprint">
    <b>גוגל דוקס:</b> הכפתור מעתיק את המסמך ללוח, ואז מדביקים אותו במסמך גוגל פתוח.
    זו הדבקה ולא שמירה ישירה לדרייב — שמירה ישירה דורשת חיבור חשבון גוגל, שאין ללוח.
    <b>התמונות לא עוברות בהדבקה</b>, ולכן לשליחה לקבלן עדיף PDF.</div>`));
}
/* ההסבר נשמר גם כשדה וגם בתוך t. כשיש שדה — הוא המקור. */
function noteOf(it){
  if(it.note)return it.note;
  const m=String(it.t||'').match(/\*\*(.+?)\*\*/);
  return m?m[1]:String(it.t||'').replace(/^📍[^·]*·\s*/,'').replace(/\*/g,'');
}
/* הדפסה לוקחת את התמונות המלאות — ממוזערת של 240px נראית רכה על נייר */
async function printFull(app,btn){
  const imgs=[...app.querySelectorAll('.lk img[data-thumb="1"]')];
  if(imgs.length){
    btn.disabled=true;
    for(let i=0;i<imgs.length;i++){
      btn.textContent=`טוען תמונות לאיכות הדפסה ${i+1}/${imgs.length}…`;
      const j=await getJSON(FDATA+'/'+imgs[i].dataset.fid+'.json');
      const d=j&&(j.data||j);
      if(typeof d==='string'){ imgs[i].src=d; delete imgs[i].dataset.thumb; }
    }
    btn.textContent='🖨 הדפסה או שמירה כ-PDF'; btn.disabled=false;
  }
  window.print();
}
function waText(){
  const R='‏', today=new Date().toLocaleDateString('he-IL',{day:'numeric',month:'numeric'});
  let s=`${R}*רשימת ליקויים — הבית שלנו*\n${R}_${today}_\n`;
  let num=0;
  grouped(false).forEach(z=>{
    s+=`\n${R}*${z.zone}*\n`;
    z.rooms.forEach(r=>{
      s+=`${R}_${r.room}_\n`;
      r.rows.forEach(it=>{ num++;
        s+=`${R}${num}. ${noteOf(it)}${it.loc2?` (${it.loc2})`:''}\n`; });
    });
  });
  s+=`\n${R}סה״כ ${num} ליקויים. נשמח לדעת מה מתוקן ועד מתי 🙏`;
  return s;
}
/* גוגל דוקס ווורד אינם יורשים כיוון מ-CSS בלבד — צריך dir על כל
   אלמנט שיוצר פסקה, אחרת המספרים קופצים לצד הלא נכון. */
function docHtml(){
  const today=new Date().toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
  let b=`<h1 dir="rtl" style="font-size:19pt;margin:0 0 2pt">רשימת ליקויים</h1>
    <p dir="rtl" style="color:#777;font-size:10pt;margin:0 0 14pt">הבית שלנו · יעל ורועי אבגיל · ${today}</p>`;
  let num=0;
  grouped(false).forEach(z=>{
    b+=`<h2 dir="rtl" style="font-size:14pt;margin:16pt 0 4pt;border-bottom:1.5pt solid #6C7A44;color:#4E5A2E">${esc(z.zone)}</h2>`;
    z.rooms.forEach(r=>{
      b+=`<h3 dir="rtl" style="font-size:12pt;background:#EEEAE3;padding:4pt 7pt;margin:10pt 0 5pt">${esc(r.room)}</h3>`;
      r.rows.forEach(it=>{ num++;
