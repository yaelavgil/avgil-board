.״ — אז ההחלטה הזאת כבר מוסכמת עלייך.\n📌 בריק לבן עם רובה לבנה מול המטבח הכחול אינדיגו והשיש אטלס קריסטל וויט — בטוח ונצחי.\n\n⛔ **שלושת הדברים שחסרים כדי להזמין:**\n1. **כמה מ״ר** — אף אחד לא נתן מספר. הקיר קיים והמטבח עוד לא מורכב, אז רועי יכול למדוד בשטח ב-5 דקות: אורך הקיר מעל השיש × הגובה מהשיש עד קו החלון/הארונות.\n2. **דגם וגוון מדויקים** — לשאול את גל מה יש אצלה בזמינות מיידית.\n3. **מי מתקין** — האם זה כלול אצל ברק או בתוספת.\n\n⏰ **הסטטוס האמיתי: הנושא מת ב-15.9.** יעל ביקשה מנופר ״תוכלי לסגור את זה עם ברק?״ ונופר לא ענתה מאז.\n💡 אם נופר לא זמינה — להתקשר ישירות לגל עם מספר ההזמנה הקיימת. עדיף חיפוי שמגיע בזמן מדגם זמין, מאשר דגם מושלם שמגיע אחרי שהמטבח כבר עומד.", "order": 520, "owner": "רועי", "title": "🔴 קרמיקה לחיפוי המטבח — ההרכבה הוקדמה ל-6.10", "updatedAt": 1791127415609, "wa": "היי גל,\nאנחנו צריכים להזמין את חיפוי הקיר מעל השיש במטבח.\nהמטבח מגיע מחר (5.10) ומורכב ב-6.10, אז אנחנו לחוצים בזמן.\n\nמה שאנחנו מחפשים: בריקים לבנים, בהנחה אופקית או אנכית (לא פישבון).\nהמטבח כחול אינדיגו והשיש אטלס קריסטל וויט.\n\nשתי שאלות:\n1. מה יש אצלך בזמינות מיידית שמתאים לתיאור?\n2. נשאר לנו משהו מההזמנה הקיימת שאפשר להשתמש בו?\n\nאת המ״ר המדויק נעביר היום אחרי מדידה בשטח.\nתודה, רועי ויעל", "waTo": "גל — א.א קרמיקה"}, {"cat": "reno", "done": false, "due": "2026-10-09", "id": "r07", "list": "now", "notes": "🔴 **4.10: מתקיני תבור בבית היום — זאת ההזדמנות.** הם מולך, עם הכלים, מול הפתח עצמו.\n\nהמודד של תבור אמר שאין מקום/הכנה. נופר: חובה דלת פנימית ואקוסטית לפרטיות — הקיימת ישנה ולא מבודדת.\n\n❓ **מה לשאול אותם עכשיו:**\n1. מה בדיוק חסר — משקוף? עומק? רוחב פתח?\n2. יש פתרון שהם מכירים לממ״ד בלי הכנה — דלת נגררת חיצונית, משקוף דק, פתרון על הקיר?\n3. ראו את זה בבתים אחרים? מה עשו שם?\n📌 ברק ובתים זהים באשל הם מקור המידע השני, אבל המתקין בשטח הוא הראשון.", "ongoing": false, "order": 525, "owner": "יעל", "title": "🔴 דלת פנימית לממ״ד — לשאול את מתקין דלתות תבור עכשיו", "updatedAt": 1791287384802}, {"cat": "reno", "done": true, "due": "2026-09-14", "id": "r08", "list": :root{
  --bg:#F5F3EA; --card:#FFFDF6; --edge:#E4E0CC; --ink:#2F2E23; --muted:#8A8770;
  --olive:#6C7A44; --olive-ink:#4E5A2E; --olive-soft:#EAEBD8;
  --pom:#C0452F; --pom-soft:#F6E3DC; --amber:#B97F1E; --amber-soft:#F4E8CE;
  --line:#DDD9C6; --chip:#EDEADB; --on:#2F2E23; --on-ink:#F5F3EA;
  --done:#A7A489; --bar:#FFFDF6;
  --shadow:0 1px 2px rgba(60,58,38,.06),0 6px 18px rgba(60,58,38,.07);
  --school:#E3E8F0; --school-ink:#46648C;
  --health:#DDEBE6; --health-ink:#2E6B58;
  direction:rtl;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F2019; --card:#2A2B21; --edge:#3A3B2D; --ink:#EDEAD9; --muted:#9C9A81;
    --olive:#A8BA6A; --olive-ink:#C3D38A; --olive-soft:#37402A;
    --pom:#E07358; --pom-soft:#46281F; --amber:#E0A94F; --amber-soft:#413418;
    --line:#3B3C2E; --chip:#34352A; --on:#EDEAD9; --on-ink:#1F2019;
    --done:#6E6C55; --bar:#24251D;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3);
    --school:#2B3442; --school-ink:#9FB6D9;
    --health:#243830; --health-ink:#8CC7B2;
  }
}
:root[data-theme="dark"]{
  --bg:#1F2019; --card:#2A2B21; --edge:#3A3B2D; --ink:#EDEAD9; --muted:#9C9A81;
  --olive:#A8BA6A; --olive-ink:#C3D38A; --olive-soft:#37402A;
  --pom:#E07358; --pom-soft:#46281F; --amber:#E0A94F; --amber-soft:#413418;
  --line:#3B3C2E; --chip:#34352A; --on:#EDEAD9; --on-ink:#1F2019;
  --done:#6E6C55; --bar:#24251D;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.3);
  --school:#2B3442; --school-ink:#9FB6D9;
  --health:#243830; --health-ink:#8CC7B2;
}
*{box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent}
html{direction:rtl; -webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Assistant',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.45; min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:620px; margin:0 auto; padding:0 14px}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:30; background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
  margin:0 -14px; border-bottom:1px solid transparent; transition:border-color .2s;
}
header.top.stuck{border-color:var(--line)}
.titlerow{display:flex; align-items:center; justify-content:space-between; gap:10px}
h1{font-family:'Karantina','Assistant',sans-serif; font-weight:700; font-size:26px; line-height:1; letter-spacing:.5px}
.sync{font-size:11px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:5px; white-space:nowrap}
.sync .dot{width:7px; height:7px; border-radius:99px; background:var(--olive)}
.sync.off .dot{background:var(--muted)} .sync.off{color:var(--muted)}
.sync.err .dot{background:var(--pom)} .sync.err{color:var(--pom)}
.datel{color:var(--muted); font-weight:600; font-size:12px; margin:0 0 7px}
/* ---- pinned strip: standing items stay on screen, one tap from open ---- */
.pinned{display:flex; flex-direction:column; gap:5px; padding-bottom:8px}
.pinrow{
  display:flex; align-items:center; gap:9px; width:100%; text-align:start;
  border:1.5px solid var(--amber); background:var(--amber-soft); color:var(--ink);
  border-radius:12px; padding:9px 11px; font:inherit; font-weight:700; font-size:14px; cursor:pointer;
}
.pinrow:active{transform:scale(.985)}
.pinrow .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pinrow .c{background:var(--pom); color:#fff; border-radius:99px; font-size:11px; font-weight:800; padding:2px 8px; flex:0 0 auto; white-space:nowrap}
.pinrow .c2{background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:99px; font-size:11px; font-weight:800; padding:1px 8px; flex:0 0 auto; white-space:nowrap}
.pinrow .go{color:var(--amber); font-size:12px; flex:0 0 auto}
/* ---- detail sheet ---- */
.dsheet{position:fixed; inset:0; z-index:65; background:rgba(20,20,16,.55); display:none}
.dsheet.on{display:block}
.dsin{
  position:absolute; inset-inline:0; bottom:0; max-height:88vh; overflow:auto;
  background:var(--card); border-radius:20px 20px 0 0; max-width:620px; margin:0 auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));
}
.dsgrip{width:40px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 12px}
.dsin h3{font-size:19px; font-weight:800; line-height:1.3; margin-bottom:10px}
.dsin .notes{font-size:14.5px}
/* ---- interactive checklist inside a task ---- */
.chk{display:flex; flex-direction:column; gap:5px; margin:10px 0 4px}
.chkhead{font-size:12px; font-weight:800; color:var(--muted); margin:8px 0 1px}
.chkrow{
  display:flex; align-items:flex-start; gap:9px; padding:9px 10px; border-radius:11px;
  border:1px solid var(--edge); background:var(--bg); cursor:pointer; position:relative;
}
.chkrow::before{content:''; position:absolute; inset-inline-start:0; top:8px; bottom:8px; width:3px; border-radius:3px}
.chkrow.lv1::before{background:var(--pom)}
.chkrow.lv2::before{background:var(--amber)}
.chkrow.lv3::before{background:var(--done)}
.chkrow.off{opacity:.5; background:transparent; border-style:dashed}
.chkrow.off .chktxt{text-decoration:line-through; text-decoration-color:var(--done)}
.chkbox{
  display:block; flex:0 0 auto; width:22px; height:22px; margin-top:1px;
  border:2px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; position:relative;
  transition:background .16s, border-color .16s;
}
.chkbox::after{content:'✓'; position:absolute; inset:0; display:grid; place-items:center; color:var(--line); font-size:12px; font-weight:800; transition:color .16s}
.chkrow:hover .chkbox{border-color:var(--olive)} .chkrow:hover .chkbox::after{color:var(--olive)}
.chkbox[data-on]{background:var(--olive); border-color:var(--olive)} .chkbox[data-on]::after{color:#fff}
.chktxt{flex:1; min-width:0; font-size:14px; line-height:1.45}
.chktxt b{font-weight:800}
.refs{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; align-items:center}
.ref{
  border:1px solid var(--line); background:var(--card); color:var(--olive-ink);
  border-radius:99px; padding:3px 10px; font:inherit; font-size:12px; font-weight:700;
  cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ref:hover{border-color:var(--olive); background:var(--olive-soft)}
.refnote{font-size:12px; color:var(--muted); font-weight:700}
.reflink{
  display:inline-block; border:1px solid var(--line); background:var(--card); color:var(--olive-ink);
  border-radius:99px; padding:1px 9px; font-size:12px; font-weight:700; cursor:pointer;
  margin:1px 2px; vertical-align:baseline;
}
.reflink:hover{border-color:var(--olive); background:var(--olive-soft)}
.tel{display:inline-flex; align-items:center; gap:0; margin:1px 2px; vertical-align:baseline; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--card)}
.tel a{display:inline-block; padding:2px 10px; font-size:12.5px; font-weight:700; color:var(--ink); text-decoration:none; white-space:nowrap}
.tel a+a{border-inline-start:1px solid var(--line); color:#1f8a4c; padding:2px 9px}
.tel a:hover{background:var(--olive-soft)}
.links{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px}
.lnk{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--card);
     color:var(--olive-ink); border-radius:10px; padding:6px 11px; font-size:12.5px; font-weight:700; text-decoration:none}
.lnk:hover{border-color:var(--olive); background:var(--olive-soft)}
/* linked sub-tasks */
.subhead{font-size:12px; font-weight:800; color:var(--muted); margin:16px 0 6px}
.subrow{
  display:flex; align-items:center; gap:9px; width:100%; text-align:start; cursor:pointer;
  border:1px solid var(--edge); background:var(--bg); border-radius:11px; padding:9px 11px; font:inherit;
}
.subrow:hover{border-color:var(--olive)}
.subrow.off{opacity:.5; border-style:dashed}
.subrow .st{flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--muted)}
.subrow .st.late{background:var(--pom)} .subrow .st.soon{background:var(--olive)} .subrow .st.ok{background:var(--done)}
.subrow .n{flex:1; min-width:0; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.subrow .d{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--muted)}
.subs{display:flex; flex-direction:column; gap:5px}
.parentchip{
  display:inline-flex; align-items:center; gap:4px; background:var(--amber-soft); color:var(--amber);
  border-radius:99px; padding:2px 9px; font-size:11.5px; font-weight:800; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.linkbtn{width:100%; margin-top:12px; border:1.5px dashed var(--line); background:transparent; color:var(--olive-ink);
  border-radius:12px; padding:11px; font:inherit; font-weight:800; font-size:14px; cursor:pointer}
.linkbtn:hover{border-color:var(--olive); background:var(--olive-soft)}
.picksearch{width:100%; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:11px; padding:10px 12px; font:inherit; font-size:15px; outline:none; margin-bottom:10px}
.picksearch:focus{border-color:var(--olive)}
.chkdone{font-size:12px; color:var(--muted); font-weight:700; margin-top:10px}
.sheettop{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.sheettop .back{flex:1; text-align:start; border:none; background:transparent; color:var(--olive-ink);
  font:inherit; font-size:13.5px; font-weight:800; cursor:pointer; padding:4px 0}
.sheettop .x{flex:0 0 auto; width:34px; height:34px; border:1px solid var(--line); background:var(--card);
  color:var(--muted); border-radius:50%; font-size:17px; font-weight:700; cursor:pointer; line-height:1}
.sheettop .x:hover{border-color:var(--pom); color:var(--pom)}
.itemtxt{font-size:16px; line-height:1.5; font-weight:600}
.itemtxt b{font-weight:800}
.anslbl{font-size:12px; font-weight:800; color:var(--muted); margin:14px 0 5px}
.ansbox{width:100%; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:11px; padding:11px 12px; font:inherit; font-size:15px; min-height:92px; resize:vertical; outline:none}
.ansbox:focus{border-color:var(--olive)}
.ansview{background:var(--olive-soft); border-radius:11px; padding:11px 13px; font-size:14.5px; line-height:1.5}
.ansmeta{font-size:11.5px; color:var(--muted); font-weight:700; margin-top:6px}
.itembtns{display:flex; gap:8px; margin-top:14px}
.itembtns button{flex:1; border:none; border-radius:12px; padding:13px; font:inherit; font-weight:800; font-size:15px; cursor:pointer}
.itembtns .done{background:var(--olive); color:#fff}
.itembtns .reopen{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.chkrow{user-select:none}
.dsclose{position:sticky; bottom:0; width:100%; margin-top:14px; border:none; background:var(--olive); color:#fff; border-radius:12px; padding:13px; font:inherit; font-weight:800; font-size:15px; cursor:pointer}

/* who */
.who{display:flex; gap:6px; margin-bottom:7px}
.who button{
  flex:1; border:1.5px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:11px; padding:9px 4px; font:inherit; font-weight:700; font-size:14px; cursor:pointer;
}
.who button.on{background:var(--on); border-color:var(--on); color:var(--on-ink)}

/* days */
.days{display:flex; gap:6px; overflow-x:auto; overflow-y:visible; padding:9px 5px 8px; margin:-8px -5px 0;
       scrollbar-width:none; -webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.daychip{
  flex:0 0 auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:6px 11px 7px; font:inherit; cursor:pointer; text-align:center;
  min-width:58px; line-height:1.2; position:relative;
}
.daychip b{display:block; font-size:10.5px; font-weight:700; color:var(--muted); white-space:nowrap}
.daychip i{display:block; font-style:normal; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums}
.daychip .n{
  position:absolute; top:-7px; inset-inline-start:-4px; background:var(--olive); color:#fff;
  font-size:10px; font-weight:800; border-radius:99px; min-width:17px; padding:1px 5px;
  line-height:1.35; box-shadow:0 0 0 2px var(--bg);
}
.daychip.on{border-color:var(--olive); background:var(--olive-soft)}
.daychip.on b{color:var(--olive-ink)}
.daychip.late{border-color:var(--pom)} .daychip.late .n{background:var(--pom)}
.daychip.late.on{background:var(--pom-soft)} .daychip.late.on b{color:var(--pom)}
.dayclear{flex:0 0 auto; align-self:center; border:none; background:transparent; color:var(--pom); font:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:0 6px}

/* filter sheet trigger row */
.toolrow{display:flex; gap:6px; align-items:center; padding-bottom:9px}
.toolrow input{
  flex:1; min-width:0; border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:11px; padding:8px 12px; font:inherit; font-size:15px; outline:none;
}
.toolrow input:focus{border-color:var(--olive)}
.catbtn{
  border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:11px;
  padding:8px 12px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;
}
.catbtn.on{border-color:var(--olive); background:var(--olive-soft); color:var(--olive-ink)}

/* ---------- buckets ---------- */
section.bucket{margin:18px 0}
.bhead{display:flex; align-items:baseline; gap:8px; margin-bottom:9px; flex-wrap:wrap}
.bhead h2{font-family:'Karantina','Assistant',sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px}
.bhead .bn{color:var(--muted); font-size:13px; font-weight:700}
.bhead .hint{font-size:11.5px; color:var(--muted); font-weight:600}
.bhead.hot h2{color:var(--pom)}
.bhead.ong h2{color:var(--amber)}
.list{display:flex; flex-direction:column; gap:8px}

/* ---------- task card ---------- */
.task{
  background:var(--card); border:1px solid var(--edge); border-radius:14px;
  box-shadow:var(--shadow); display:flex; align-items:flex-start; gap:10px;
  padding:10px 10px 10px 12px; position:relative;
}
.task.overdue{border-inline-start:4px solid var(--pom)}
.task.isong{border-inline-start:4px solid var(--amber); background:linear-gradient(90deg,var(--amber-soft) 0,var(--card) 44%)}
.task.isdone{opacity:.56}
.cbwrap{flex:0 0 auto; width:44px; height:44px; margin:-6px -4px -6px -6px; display:grid; place-items:center; cursor:pointer}
.cb{
  appearance:none; width:28px; height:28px; border:2px solid var(--line); border-radius:50%;
  background:transparent; cursor:pointer; position:relative;
  transition:background .18s, border-color .18s, transform .12s;
}
/* a faint tick already sitting in the ring — says "tap me" without a word */
.cb::after{
  content:'✓'; position:absolute; inset:0; display:grid; place-items:center;
  color:var(--line); font-size:15px; font-weight:800; transition:color .18s;
}
.cbwrap:hover .cb{border-color:var(--olive)}
.cbwrap:hover .cb::after{color:var(--olive)}
.cbwrap:active .cb{transform:scale(.88)}
.cb:checked{background:var(--olive); border-color:var(--olive)}
.cb:checked::after{color:#fff}
@keyframes cbpop{0%{transform:scale(1)}38%{transform:scale(1.22)}100%{transform:scale(1)}}
.cb.anim{animation:cbpop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes settle{to{opacity:.45; transform:translateY(10px) scale(.982)}}
.task.justdone{animation:settle .34s ease forwards; pointer-events:none}
@keyframes rise{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
.bucket.donebox{animation:rise .3s ease}
@media (prefers-reduced-motion: reduce){
  .cb.anim,.task.justdone,.bucket.donebox{animation:none}
}
.tbody{flex:1; min-width:0; cursor:pointer; padding-top:3px}
.ttl{font-weight:700; font-size:16px; line-height:1.3; word-break:break-word}
.task.isdone .ttl{text-decoration:line-through; text-decoration-color:var(--done)}
.meta{display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-top:5px}
.pill{border-radius:99px; padding:2px 9px; font-size:12px; font-weight:700; white-space:nowrap}
.pill.date{background:var(--chip); color:var(--muted)}
.pill.soon{background:var(--olive-soft); color:var(--olive-ink)}
.pill.late{background:var(--pom-soft); color:var(--pom)}
.pill.own{background:var(--chip); color:var(--ink)}
.pill.cat{background:var(--chip); color:var(--muted)}
.pill.cat.school{background:var(--school); color:var(--school-ink)}
.pill.cat.health{background:var(--health); color:var(--health-ink)}
.notes{font-size:13.5px; color:var(--muted); margin-top:6px; line-height:1.5; word-break:break-word}
.notes.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.notes b{color:var(--ink); font-weight:700}
.notes code{background:var(--chip); border-radius:5px; padding:1px 5px; font-size:12.5px}
.notes a{color:var(--olive-ink)}
.notes .li{padding-inline-start:12px; position:relative}
.notes .li::before{content:'·'; position:absolute; inset-inline-start:3px; font-weight:800}
.chev{
  flex:0 0 auto; width:30px; height:30px; border:none; background:transparent; color:var(--muted);
  font-size:13px; cursor:pointer; display:grid; place-items:center; transition:transform .18s; margin-top:2px;
}
.task.open .chev{transform:rotate(180deg)}

/* expanded actions */
.acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding-top:9px; border-top:1px solid var(--line)}
.acts button{
  border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:10px;
  padding:7px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer;
}
.acts button.wa{border-color:var(--olive); color:var(--olive-ink); background:var(--olive-soft)}
.acts .sep{flex-basis:100%; height:0}
.acts .lbl{font-size:12px; color:var(--muted); font-weight:700; align-self:center; padding-inline-end:2px}

/* ---------- editor ---------- */
.editor{background:var(--card); border:1.5px solid var(--olive); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:9px; box-shadow:var(--shadow)}
.editor input,.editor textarea{
  width:100%; border:1.5px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:10px; padding:10px 12px; font:inherit; font-size:16px; outline:none;
}
.editor textarea{min-height:130px; resize:vertical; font-size:14px; line-height:1.5}
.editor input:focus,.editor textarea:focus{border-color:var(--olive)}
.erow{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.erow>.lbl{font-size:12px; color:var(--muted); font-weight:700; width:100%}
.ebtns{display:flex; gap:8px; margin-top:2px}
.ebtns .save{flex:1; background:var(--olive); color:#fff; border:none; border-radius:11px; padding:12px; font:inherit; font-weight:800; cursor:pointer}
.ebtns .del{background:transparent; color:var(--pom); border:1.5px solid var(--line); border-radius:11px; padding:12px 14px; font:inherit; font-weight:700; cursor:pointer}

/* ---------- bottom bar ---------- */
nav.bar{
  position:fixed; bottom:0; inset-inline:0; z-index:40; background:var(--bar);
  border-top:1px solid var(--line); display:flex; align-items:stretch;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:3px;
  box-shadow:0 -2px 14px rgba(60,58,38,.06);
}
nav.bar .t{
  flex:1; border:none; background:transparent; color:var(--muted); font:inherit; font-weight:700;
  font-size:11.5px; cursor:pointer; border-radius:11px; padding:5px 2px 4px;
  display:flex; flex-direction:column; align-items:center; gap:2px; min-height:48px; justify-content:center;
}
nav.bar .t .ic{font-size:17px; line-height:1}
nav.bar .t .n{font-size:10px; font-weight:800; background:var(--chip); border-radius:99px; padding:0 5px; color:var(--muted)}
nav.bar .t.on{color:var(--ink); background:var(--chip)}
nav.bar .t.on .n{background:var(--olive); color:#fff}
nav.bar .add{
  flex:0 0 auto; width:52px; border:none; background:var(--olive); color:#fff; border-radius:13px;
  font-size:27px; font-weight:400; cursor:pointer; line-height:1;
}
nav.bar .add:active{transform:scale(.95)}

/* add sheet */

<script>
document.documentElement.lang='he'; document.documentElement.dir='rtl';

/* ================= constants ================= */
const CATS={trip:'✈️ פולין', reno:'🏠 שיפוץ', home:'🧺 בית', gift:'🎁 מתנות',
            idea:'💡 רעיונות', school:'🎒 בי"ס', health:'🩺 בריאות'};
const OWNERS=['יעל','רועי','שנינו'];
const WD=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const BUCKETS=[
  {key:'ongoing',name:'מתמשך',   ong:true, hint:'לא נגמר — להציף בכל פגישה'},
  {key:'hot',    name:'דחוף והיום', hot:true},
  {key:'week',   name:'השבוע'},
  {key:'month',  name:'החודש'},
  {key:'later',  name:'בהמשך'},
  {key:'someday',name:'מתישהו'},
  {key:'done',   name:'הושלם'}
];
const TABS=[
  {key:'today',ic:'🔥',name:'היום'},
  {key:'week', ic:'📅',name:'השבוע'},
  {key:'all',  ic:'📋',name:'הכל'},
  {key:'done', ic:'✓', name:'הושלם'}
];
/* 'ongoing' is deliberately absent — those live in the pinned strip above the list */
const TB={today:['hot'], week:['hot','week'],
          all:['hot','week','month','later','someday'], done:['done']};

/* ================= state ================= */
let tasks=[];
let live=false;
const ui={tab:'week', cats:new Set(), q:'', days:new Set(), open:new Set(),
          editing:null, owner:null, showCats:false};
/* ticked during this visit — stays on screen in "הושלם עכשיו" instead of vanishing */
const justDone=[];

try{ ui.owner=localStorage.getItem('av_owner')||null; }catch(e){}

/* First paint comes from what THIS browser last synced, not from the copy baked
   into the page at publish time — that copy ages the moment anyone ticks anything,
   and showing it as if it were current is what made ticked tasks look undone. */
const CACHE='av_tasks_v1';
let fromCache=false;
try{
  const c=localStorage.getItem(CACHE);
  if(c){ tasks=JSON.parse(c)||[]; fromCache=tasks.length>0; }
}catch(e){}
if(!tasks.length){
  try{ tasks=JSON.parse(document.getElementById('seed').textContent).tasks||[]; }catch(e){ tasks=[]; }
}
function cacheTasks(){
  try{ localStorage.setItem(CACHE,JSON.stringify(tasks)); }catch(e){}
}

/* ================= helpers ================= */
const DAY=864e5;
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(iso){if(!iso)return null;const t=new Date(todayStr()),d=new Date(iso);return Math.round((d-t)/DAY)}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild}
function byId(id){return tasks.find(t=>t.id===id)}
function childrenOf(id){return tasks.filter(t=>t.parent===id).sort((a,z)=>(a.done?1:0)-(z.done?1:0)||(a.due||'9')<(z.due||'9')?-1:1)}

/* notes: a deliberately small markdown subset.
   `*(r06 · הערה)*` becomes a chip carrying the task's real name plus the note,
   so a reference reads as a destination rather than as a code. */
function refsToChips(html){
  const slots=[];
  const keep=h=>{ slots.push(h); return '\u0000'+(slots.length-1)+'\u0000'; };
  const chip=id=>{
    const n=shortTitle(id);
    return n?keep(`<span class="reflink" data-ref="${id}">\u2197 ${esc(n)}</span>`):null;
  };
  /* the explicit form first: *(r06 · note)* */
  html=html.replace(/\*\(([^)]+)\)\*/g,(whole,inner)=>{
    const parts=inner.split('·');
    const ids=parts[0].split(',').map(x=>x.trim()).filter(x=>/^[a-z]+\d+$/.test(x));
    if(!ids.length)return whole;
    const chips=ids.map(chip).filter(Boolean).join('');
    if(!chips)return whole;
    const note=parts.slice(1).join('·').trim();
    return chips+(note?` <span class="refnote">${esc(note)}</span>`:'');
  });
  /* then any bare id still sitting in the prose — only if it names a real task,
     so colour codes like LR404 or NWC 033 are never mistaken for one */
  html=html.replace(/\b([a-z]{1,4}\d{1,15})\b/g,m=>chip(m)||m);
  /* Israeli phone numbers — tap to call, or straight to WhatsApp on a mobile.
     The leading 0 plus a valid prefix keeps bank accounts, invoice numbers
     and dates from being mistaken for phones. */
  html=html.replace(/\b(0(?:5\d|7\d|[2-4]|[89]))-?(\d{7})\b/g,(m,pre,rest)=>{
    const digits=pre+rest;
    const pretty=pre+'-'+rest;
    const mob=/^05/.test(digits);
    return keep('<span class="tel"><a href="tel:'+digits+'">\ud83d\udcde '+pretty+'</a>'+
      (mob?'<a href="https://wa.me/972'+digits.slice(1)+'" target="_blank" rel="noopener">\ud83d\udcac</a>':'')+
      '</span>');
  });
  /* tidy the brackets and connectors left around a chip */
  html=html.replace(/[(\[]\s*(\u0000\d+\u0000(?:\s*[,ו]?\s*\u0000\d+\u0000)*)\s*[)\]]/g,'$1');
  html=html.replace(/([\u05d0-\u05ea])-(\u0000\d+\u0000)/g,'$1 $2');
  return html.replace(/\u0000(\d+)\u0000/g,(x,i)=>slots[i]);
}
function md(s){
  return refsToChips(esc(s||'')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .split('\n').map(l=>{
      const t=l.trim();
      if(/^[•·]\s?/.test(t))return '<div class="li">'+t.replace(/^[•·]\s?/,'')+'</div>';
      return '<div>'+(t||'&nbsp;')+'</div>';
    }).join(''));
}
/* one delegated handler covers every chip the renderer ever emits */
addEventListener('click',e=>{
  const r=e.target.closest&&e.target.closest('.reflink');
  if(!r)return;
  e.preventDefault(); e.stopPropagation();
  openDetail(r.dataset.ref);
},true);
function bucketOf(t){
  if(t.done)return 'done';
  if(t.ongoing)return 'ongoing';
  const du=daysUntil(t.due);
  if(du!==null&&du<=0)return 'hot';
  if(t.pin)return t.pin;
  if(du!==null){ if(du<=7)return 'week'; if(du<=31)return 'month'; return 'later'; }
  return {now:'hot',week:'week',later:'later',someday:'someday'}[t.list]||'week';
}
function dateChip(t){
  if(t.ongoing)return '';
  if(!t.due)return '';
  const du=daysUntil(t.due);
  if(t.done)return `<span class="pill date">${fmtDate(t.due)}</span>`;
  if(du<0)   return `<span class="pill late">עבר · ${fmtDate(t.due)}</span>`;
  if(du===0) return `<span class="pill soon">היום</span>`;
  if(du===1) return `<span class="pill soon">מחר</span>`;
  return `<span class="pill date">${fmtDate(t.due)}</span>`;
}
function toast(msg){
  const n=document.getElementById('toast'); n.textContent=msg; n.classList.add('on');
  clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('on'),2600);
}

/* ================= persistence ================= */
function setSync(txt,cls){
  const n=document.getElementById('sync');
  n.className='sync'+(cls?' '+cls:''); document.getElementById('syncT').textContent=txt;
}
const SITE='https://yaelavgil.github.io/avgil-board/';
function setOffline(on,why){
  live=!on;
  const b=document.getElementById('offbar');
  b.classList.toggle('on',on);
  if(on){
    const here=location.hostname.indexOf('github.io')<0;
    b.innerHTML='⚠️ <b>לא מחובר — מה שמוצג כאן אינו מעודכן.</b><br>'+
      (why?esc(why)+'<br>':'')+
      (here?'הלוח החי נמצא ב-<a href="'+SITE+'" target="_blank" rel="noopener">yaelavgil.github.io/avgil-board</a> — כדאי לפתוח אותו שם.'
           :'בודקים שוב כל 20 שניות. אפשר גם לרענן את העמוד.')+
      '<br>שינויים לא יישמרו עד שהחיבור יחזור.';
  }
}
function guard(){
  if(live)return true;
  toast('לא מחובר — השינוי לא יישמר');
  return false;
}
/* ids whose write is still in the air — an incoming update must not roll these back */
const pending=new Set();
const DB='https://home-picks-47450-default-rtdb.europe-west1.firebasedatabase.app';
const NODE=DB+'/board/tasks';
/* every mutation goes through here: local first (instant), network after */
async function save(t,skipRender){
  if(!live){ toast('עוד לא התחברנו — רגע ונסי שוב'); render(); return; }
  t.updatedAt=Date.now();
  pending.add(t.id);
  if(!skipRender)render();
  try{
    const r=await fetch(NODE+'/'+encodeURIComponent(t.id)+'.json',
      {method:'PUT',body:JSON.stringify(t)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    cacheTasks(); setSync('מסונכרן',''); setOffline(false);
  }catch(e){
    setSync('לא נשמר','err'); setOffline(true,'השמירה לא הגיעה לשרת.');
    toast('השמירה נכשלה — נסו שוב');
  }
  finally{ setTimeout(()=>pending.delete(t.id),1500); }
}
async function removeTask(id){
  if(!guard())return false;
  const keep=byId(id); if(!keep)return false;
  pending.add(id);
  try{
    const r=await fetch(NODE+'/'+encodeURIComponent(id)+'.json',{method:'DELETE'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    tasks=tasks.filter(x=>x.id!==id);      /* only now is it really gone */
    toast('נמחקה ✓');
  }catch(e){
    setOffline(true,'המחיקה לא הגיעה לשרת.');
    toast('המחיקה נכשלה — המשימה נשארה');  /* and it really did stay */
  }finally{
    setTimeout(()=>pending.delete(id),1500);
    render();
  }
}
/* an update arriving from the other phone.
   `put` replaces what is at the path; `patch` merges into it — treating a
   patch as a replace silently strips every field it did not mention. */
function applyRemote(path,data,isPatch){
  if(path==='/'){
    if(!data)return;
    const next=Object.keys(data).map(k=>Object.assign({id:k},data[k]));
    tasks=next.map(d=>pending.has(d.id)?(byId(d.id)||d):d);
  }else{
    const seg=path.replace(/^\//,'').split('/').filter(Boolean);
    const id=seg[0];
    if(!id||pending.has(id))return;
    const prev=byId(id);
    const i=tasks.findIndex(x=>x.id===id);
    if(seg.length===1){
      if(data===null&&!isPatch){ tasks=tasks.filter(x=>x.id!==id); }
      else{
        const merged=isPatch ? Object.assign({},prev||{},data,{id})
                             : Object.assign({id},data);
        if(i>-1)tasks[i]=merged; else tasks.push(merged);
      }
    }else{
      if(!prev)return;                       /* a field changed on a task we don't hold */
      const copy=Object.assign({},prev);
      if(data===null)delete copy[seg[1]]; else copy[seg[1]]=data;
      tasks[i]=copy;
    }
  }
  cacheTasks();
  setSync('מסונכרן','');
  if(!ui.editing)render();
}

/* ================= render ================= */
function visible(t){
  if(ui.owner && t.owner!==ui.owner && !(ui.owner!=='שנינו'&&t.owner==='שנינו'))return false;
  if(ui.cats.size && !ui.cats.has(t.cat))return false;
  if(ui.q){ const h=(t.title+' '+(t.notes||'')).toLowerCase(); if(!h.includes(ui.q.toLowerCase()))return false; }
  if(ui.days.size) return ui.days.has(t.due||'none');
  return TB[ui.tab].includes(bucketOf(t));
}
function counts(){
  const c={}; BUCKETS.forEach(b=>c[b.key]=0);
  tasks.forEach(t=>{
    if(ui.owner && t.owner!==ui.owner && !(ui.owner!=='שנינו'&&t.owner==='שנינו'))return;
    c[bucketOf(t)]++;
  });
  return c;
}
function render(){
  document.getElementById('datel').textContent=
    new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
  renderWho(); renderPinned(); renderDays(); renderBar(); renderBoard();
}
/* standing items live here instead of scrolling away with the list */
function renderPinned(){
  const bar=document.getElementById('pinned'); bar.innerHTML='';
  tasks.filter(t=>t.ongoing&&!t.done)
       .sort((a,z)=>(a.order||0)-(z.order||0))
       .forEach(t=>{
    const items=Array.isArray(t.items)?t.items:null;
    const kids=childrenOf(t.id);
    const open=(items?items.filter(i=>!i.done).length:0)+kids.filter(k=>!k.done).length;
    const urgent=items ? items.filter(i=>!i.done&&(i.lv||2)===1).length
                       : ((t.notes||'').match(/🔴/g)||[]).length;
    /* a bare number reads as nothing — say what is being counted */
    const row=el(`<button class="pinrow">
      <span>🔁</span><span class="t">${esc(t.title.replace(/^🔁\s*/,'').split(/\s[—–]\s/)[0])}</span>
      ${urgent?`<span class="c">${urgent} דחוף</span>`:''}
      ${items?`<span class="c2">${open} פתוח</span>`:''}<span class="go">▸</span></button>`);
    row.onclick=()=>openDetail(t.id);
    bar.appendChild(row);
  });
}
/* items carry references to the full task they came from — show them as
   names you can tap, not as the raw ids they are stored under */
function splitRefs(txt){
  const m=txt.match(/\s*\*\(([^)]+)\)\*\s*$/);
  if(!m)return {body:txt, ids:[], note:''};
  const parts=m[1].split('·');
  const ids=parts[0].split(',').map(x=>x.trim()).filter(x=>/^[a-z]+\d+$/i.test(x));
  let note=parts.slice(1).join('·').trim();
  if(!ids.length&&!note)note=parts[0].trim();
  return {body:txt.slice(0,m.index).trim(), ids, note};
}
function shortTitle(id){
  const t=byId(id); if(!t)return null;
  let s=t.title.replace(/[🔴🟠🟡🔵✅⛔📦🔧🗑️👤🔁]/g,'').replace(/\s+/g,' ').trim();
  s=s.split(/\s[—–]\s/)[0];
  return s.length>26?s.slice(0,25)+'…':s;
}
/* a task's items are live data, not text — tick one and it moves to the bottom */
/* attachments a task carries: {label, url} — plans, quotes, sites */
function linksEl(t){
  if(!Array.isArray(t.links)||!t.links.length)return null;
  const w=el('<div class="links"></div>');
  t.links.forEach(l=>{
    if(!l||!l.url)return;
    const ic=/\.pdf($|\?)/i.test(l.url)?'📄'
      :/\.(png|jpe?g|webp|gif|heic)($|\?)/i.test(l.url)?'🖼'
      :/drive\.google|docs\.google/.test(l.url)?'📁'
      :/wa\.me|whatsapp/.test(l.url)?'💬':'🔗';
    const a=el(`<a class="lnk" target="_blank" rel="noopener">${ic} ${esc(l.label||l.url)}</a>`);
    a.href=l.url; a.onclick=e=>e.stopPropagation();
    w.appendChild(a);
  });
  return w.children.length?w:null;
}
function checklistEl(id,onChange){
  const t=byId(id); if(!t||!Array.isArray(t.items)||!t.items.length)return null;
  const wrap=el('<div class="chk"></div>');
  const open=t.items.filter(i=>!i.done), closed=t.items.filter(i=>i.done);
  const row=it=>{
    const {body,ids,note}=splitRefs(it.t);
    const r=el(`<div class="chkrow lv${it.lv||2} ${it.done?'off':''}">
      <span class="chkbox" ${it.done?'data-on="1"':''}></span>
      <span class="chktxt">${md(body).replace(/<\/?div>/g,'')}</span></div>`);
    r.onclick=ev=>{ if(ev.target.closest('.reflink,.tel,a'))return; openItem(id,it.k); };
    const refs=ids.map(x=>[x,shortTitle(x)]).filter(([,n])=>n);
    if(it.ans){
      const a=el(`<div class="ansview" style="margin-top:7px;font-size:13px">${md(it.ans).replace(/<\/?div>/g,' ')}</div>`);
      r.querySelector('.chktxt').appendChild(a);
    }
    if(refs.length||note){
      const bar=el('<div class="refs"></div>');
      refs.forEach(([rid,name])=>{
        const b=el(`<button type="button" class="ref">↗ ${esc(name)}</button>`);
        b.onclick=ev=>{ ev.preventDefault(); ev.stopPropagation(); openDetail(rid); };
        bar.appendChild(b);
      });
      if(note)bar.appendChild(el(`<span class="refnote">${esc(note)}</span>`));
      r.querySelector('.chktxt').appendChild(bar);
    }
    return r;
  };

function dayBuckets(){

  tasks.forEach(t=>{
    if(t.done||t.ongoing)return;
    if(ui.owner && t.owner!==ui.owner && !(ui.owner!=='שנינו'&&t.owner==='שנינו'))return;

function taskEl(t){
  /* the captured object goes stale the moment a sync replaces the task list —

  const T=()=>byId(t.id)||t;
  const du=daysUntil(t.due);
  const late=(!t.done&&!t.ongoing&&du!==null&&du<0);
  const open=ui.open.has(t.id);

               :`<label class="cbwrap"><input type="checkbox" class="cb" ${t.done?'checked':''}></label>`}
    <div class="tbody">
      <div class="ttl">${esc(t.title)}</div>
      <div class="meta">
        ${dateChip(t)}
        ${t.owner?`<span class="pill own">${t.owner}</span>`:''}
        ${t.cat?`<span class="pill cat ${t.cat}">${CATS[t.cat]||''}</span>`:''}
        ${t.parent&&byId(t.parent)?`<span class="parentchip">↳ ${esc(shortTitle(t.parent)||'')}</span>`:''}
      </div>
      ${hasN?`<div class="notes ${open?'':'clamp'}">${md(t.notes)}</div>`:''}
      ${open?'<div class="acts"></div>':''}
      ${(t.done&&!open)?'<button class="undo">↩ החזרה למשימות</button>':''}
    </div>
    ${(hasN||true)?'<button class="chev">▾</button>':''}
  </article>`);

  const cbEl=node.querySelector('.cb');
  if(cbEl)cbEl.onchange=e=>{
    const cur=T();                           /* never trust the captured object */
    cur.done=e.target.checked;
    const cb=cbEl;
    if(cur.done){
      const i=justDone.indexOf(cur.id); if(i>-1)justDone.splice(i,1);
      justDone.unshift(cur.id);
      cb.classList.add('anim');
      node.classList.add('justdone');
      save(cur,true);                        /* write now, re-render after the animation */
      setTimeout(()=>{ if(!ui.editing)render(); },340);
    }else{
      const i=justDone.indexOf(cur.id); if(i>-1)justDone.splice(i,1);
      cb.classList.add('anim');
      save(cur);
    }
  };
  const un=node.querySelector('.undo');
  if(un)un.onclick=ev=>{
    ev.stopPropagation();
    const cur=T(); cur.done=false;
    const i=justDone.indexOf(cur.id); if(i>-1)justDone.splice(i,1);
    save(cur); toast('חזרה לרשימה');
  };
  const toggle=()=>{ ui.open.has(t.id)?ui.open.delete(t.id):ui.open.add(t.id); render(); };
  node.querySelector('.tbody').onclick=toggle;
  node.querySelector('.chev').onclick=e=>{e.stopPropagation();toggle()};

  if(open){
    const chk=checklistEl(t.id,()=>render());
    if(chk)node.querySelector('.tbody').insertBefore(chk,node.querySelector('.acts'));
    const lk=linksEl(t);
    if(lk)node.querySelector('.tbody').insertBefore(lk,node.querySelector('.acts'));
    const acts=node.querySelector('.acts');
    if(!t.ongoing){
      acts.appendChild(el('<span class="lbl">דחייה:</span>'));
      [['היום',0],['מחר',1],['+3',3],['שבוע',7]].forEach(([lab,n])=>{

          ev.stopPropagation();

          const stays=TB[ui.tab].includes(bucketOf(cur));
          save(cur);
          toast(stays ? 'נדחה ל'+(n===0?'היום':fmtDate(cur.due))
                      : 'נדחה ל'+fmtDate(cur.due)+' · לא מוצג בתצוגה הזאת');
        };
        acts.appendChild(b);
      });
      acts.appendChild(el('<div class="sep"></div>'));
    }
    if(t.wa){
      const b=el('<button class="wa">📋 העתקת הודעה'+(t.waTo?' ל'+esc(t.waTo):'')+'</button>');
      b.onclick=async ev=>{
        ev.stopPropagation();
        try{ await navigator.clipboard.writeText(T().wa||''); toast('ההודעה הועתקה ✓'); }
        catch(e){ toast('ההעתקה נכשלה'); }
      };
      acts.appendChild(b);
      const w=el('<button class="wa">💬 וואטסאפ</button>');
      w.onclick=ev=>{ev.stopPropagation(); open_wa(T().wa||'')};

    acts.appendChild(ed);
  }
  return node;

/* a task becomes a calendar event with alarms — the only reminder channel
   that actually reaches someone else's phone, and he consents by adding it */
function icsFor(t){
  const pad=n=>String(n).padStart(2,'0');
  const day=(t.due||todayStr()).split('-').map(Number);
  const m=(t.notes||'').match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);   /* a time written in the notes wins */
  const hh=m?+m[1]:9, mm=m?+m[2]:0;
  const st=new Date(day[0],day[1]-1,day[2],hh,mm);
  const en=new Date(st.getTime()+15*60000);
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const esc=v=>String(v||'').replace(/\\/g,'\\\\').replace(/[,;]/g,c=>'\\'+c).replace(/\r?\n/g,'\\n');
  const body=(t.notes||'').replace(/<[^>]*>/g,'').slice(0,700);
  const who=t.owner?' ['+t.owner+']':'';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//avgil-board//HE','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:'+t.id+'-'+Date.now()+'@avgil-board',
    'DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(st),'DTEND:'+fmt(en),
    'SUMMARY:'+esc(t.title.replace(/^[🔴🟠🟡🔵✅⛔📦🔧🗑️👤🔁]\s*/,'')+who),
    'DESCRIPTION:'+esc(body+'\n\nמתוך לוח של האבגילים המשפצים\nhttps://yaelavgil.github.io/avgil-board/'),
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+esc(t.title),'END:VALARM',
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+esc(t.title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function addToCalendar(id){
  const t=byId(id); if(!t)return;
  const blob=new Blob([icsFor(t)],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(t.title.replace(/[^\u0590-\u05ea\w ]/g,'').trim().slice(0,40)||'task')+'.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},400);
  toast('נפתח ליומן — לאשר הוספה');
}

    <input type="text" class="e-t" value="${esc(t.title)}">
    <div class="erow"><span class="lbl">תאריך</span>
      <input type="date" class="e-d" value="${t.due||''}" style="width:auto;flex:1">
      <button class="catbtn e-nodate" type="button">בלי</button></div>
    <div class="erow"><span class="lbl">קטגוריה</span>
      ${Object.entries(CATS).map(([k,v])=>`<button type="button" class="catbtn ${t.cat===k?'on':''}" data-k="${k}">${v}</button>`).join('')}</div>
    <div class="erow"><span class="lbl">אחראי</span>
      ${OWNERS.map(o=>`<button type="button" class="catbtn ${t.owner===o?'on':''}" data-o="${o}">${o}</button>`).join('')}
      <button type="button" class="catbtn e-ong ${t.ongoing?'on':''}">↻ מתמשך</button></div>
    <textarea class="e-n" placeholder="הערות…">${esc(t.notes||'')}</textarea>
    <div class="ebtns"><button class="save">שמירה ✓</button><button class="del">מחיקה</button></div>
  </div>`);
  const grab=()=>{
    t.title=node.querySelector('.e-t').value.trim()||t.title;
    const nd=node.querySelector('.e-d').value||null;
    if(nd!==t.due)delete t.pin;
    t.due=nd;
    t.notes=node.querySelector('.e-n').value;
  };
  node.querySelector('.e-nodate').onclick=()=>{node.querySelector('.e-d').value=''};
  node.querySelectorAll('.catbtn[data-k]').forEach(b=>b.onclick=()=>{
    t.cat=(t.cat===b.dataset.k?null:b.dataset.k);
    node.querySelectorAll('.catbtn[data-k]').forEach(x=>x.classList.toggle('on',x.dataset.k===t.cat));
  });
  node.querySelectorAll('.catbtn[data-o]').forEach(b=>b.onclick=()=>{
    t.owner=(t.owner===b.dataset.o?null:b.dataset.o);
    node.querySelectorAll('.catbtn[data-o]').forEach(x=>x.classList.toggle('on',x.dataset.o===t.owner));
  });
  const ong=node.querySelector('.e-ong');
  ong.onclick=()=>{ t.ongoing=!t.ongoing; ong.classList.toggle('on',t.ongoing);
    if(t.ongoing){ t.done=false; node.querySelector('.e-d').value=''; } };
  node.querySelector('.save').onclick=()=>{ grab(); if(t.ongoing){t.due=null;delete t.pin;} ui.editing=null; save(t); };
  const d=node.querySelector('.del');
  d.onclick=()=>{
    if(d.dataset.armed){ ui.editing=null; removeTask(t.id); }
    else{ d.dataset.armed='1'; d.textContent='בטוח?';
      setTimeout(()=>{if(d.isConnected){delete d.dataset.armed; d.textContent='מחיקה'}},4000); }
  };
  return node;
}

/* ================= filters & add ================= */
document.getElementById('q').oninput=e=>{ui.q=e.target.value.trim(); renderBoard()};
document.getElementById('catbtn').onclick=()=>{ui.showCats=!ui.showCats; renderCatRow()};
function renderCatRow(){
  let row=document.getElementById('catrow');
  if(row)row.remove();
  document.getElementById('catbtn').classList.toggle('on',ui.cats.size>0);
  if(!ui.showCats)return;
  row=el('<div class="days" id="catrow"></div>');
  Object.entries(CATS).forEach(([k,v])=>{
    const b=el(`<button class="catbtn ${ui.cats.has(k)?'on':''}">${v}</button>`);
    b.onclick=()=>{ ui.cats.has(k)?ui.cats.delete(k):ui.cats.add(k); renderCatRow(); render(); };
    row.appendChild(b);
  });
  document.querySelector('.toolrow').after(row);
}
const draft={owner:null, due:null, cat:null, ongoing:false};
function chipRow(host,opts,get,set){
  host.innerHTML='';
  opts.forEach(([val,label])=>{
    const b=el(`<button type="button" class="catbtn ${get()===val?'on':''}">${label}</button>`);
    b.onclick=()=>{ set(get()===val?null:val); paintDraft(); };
    host.appendChild(b);
  });
}
function paintDraft(){
  chipRow(document.getElementById('newOwner'), OWNERS.map(o=>[o,o]),
          ()=>draft.owner, v=>draft.owner=v);
  chipRow(document.getElementById('newWhen'),
          [['t','היום'],['m','מחר'],['w','עוד שבוע']],
          ()=>draft.due===todayStr()?'t':draft.due===addDays(1)?'m':draft.due===addDays(7)?'w':null,
          v=>draft.due = v==='t'?todayStr() : v==='m'?addDays(1) : v==='w'?addDays(7) : null);
  chipRow(document.getElementById('newCat'), Object.entries(CATS),
          ()=>draft.cat, v=>draft.cat=v);
  document.getElementById('newD').value=draft.due||'';
  document.getElementById('newOng').classList.toggle('on',draft.ongoing);
}
function openSheet(){
  draft.owner = (ui.owner&&ui.owner!=='שנינו') ? ui.owner : 'יעל';   /* ברירת מחדל: את */
  draft.due   = todayStr();                                          /* ברירת מחדל: היום */
  draft.cat=null; draft.ongoing=false;
  document.getElementById('newT').value='';
  document.getElementById('newN').value='';
  paintDraft();
  document.getElementById('sheet').classList.add('on');
  setTimeout(()=>document.getElementById('newT').focus(),60);
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
document.getElementById('newD').onchange=e=>{ draft.due=e.target.value||null; paintDraft(); };
document.getElementById('newOng').onclick=()=>{ draft.ongoing=!draft.ongoing; if(draft.ongoing)draft.due=null; paintDraft(); };
document.getElementById('newX').onclick=closeSheet;
document.getElementById('sheet').onclick=e=>{ if(e.target.id==='sheet')closeSheet(); };
document.getElementById('newGo').onclick=addTask;
document.getElementById('newT').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('newN').focus()});
function addTask(){
  const v=document.getElementById('newT').value.trim(); if(!v)return;
  const t={id:'t'+Date.now()+Math.floor(Math.random()*99), title:v,
    notes:document.getElementById('newN').value.trim(),
    cat:draft.cat, due:draft.ongoing?null:draft.due,
    list:'now', order:Math.max(0,...tasks.map(x=>x.order||0))+10,
    done:false, owner:draft.owner, ongoing:draft.ongoing};
  tasks.push(t); closeSheet();
  /* a new task must never land somewhere the current view hides it */
  ui.days.clear(); ui.q=''; ui.cats.clear(); ui.showCats=false;
  const q=document.getElementById('q'); if(q)q.value='';
  if(ui.owner && t.owner!==ui.owner && t.owner!=='שנינו')ui.owner=null;
  if(!t.ongoing){
    const b=bucketOf(t);
    ui.tab = b==='hot'?'today' : (b==='week'?'week':'all');
  }
  save(t);
  toast(t.ongoing?'נוספה כמשימה חוזרת ✓':'נוספה ✓');
  setTimeout(()=>{
    const n=[...document.querySelectorAll('.task')].find(c=>c.querySelector('.ttl').textContent.trim()===v);
    if(n){ n.classList.add('justadded'); n.scrollIntoView({block:'center',behavior:'smooth'}); }
  },120);
}
addEventListener('scroll',()=>{
  document.getElementById('top').classList.toggle('stuck',scrollY>4);
},{passive:true});

/* ================= boot ================= */
closeDetail();          /* never start with a sheet showing */
render();

async function pull(){
  try{
    const r=await fetch(NODE+'.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    applyRemote('/', await r.json());
    setOffline(false); setSync('מסונכרן','');
  }catch(e){
    setSync('לא מחובר','err');
    setOffline(true,'לא ניתן להגיע למסד הנתונים מהעמוד הזה.');
  }
}
(async()=>{
  setSync(fromCache?'מתעדכן…':'טוען…','off');
  await pull();
  if(!live)setInterval(pull,20000);          /* keep trying */
  /* Firebase streams changes over server-sent events — the other phone's
     ticks arrive here within a second, with no SDK and no sign-in */
  let es=null;
  try{
    es=new EventSource(NODE+'.json');
    const on=isPatch=>e=>{ try{ const m=JSON.parse(e.data); applyRemote(m.path,m.data,isPatch); }catch(x){} };
    es.addEventListener('put',on(false));
    es.addEventListener('patch',on(true));
    es.onopen=()=>{ setSync('מסונכרן',''); setOffline(false); };
    es.onerror=()=>{ if(es.readyState===2){ es=null; setInterval(pull,20000); } };
  }catch(e){ setInterval(pull,20000); }
  /* a phone that was asleep reconnects the moment it comes back */
  addEventListener('visibilitychange',()=>{ if(!document.hidden)pull(); });
})();
</script>
